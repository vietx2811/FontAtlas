[package]
name = "app"
version = "0.3.1"
description = "FontAtlas: khám phá, so sánh và ghép cặp font"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.92"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
fontatlas-activate = { path = "crates/fontatlas-activate" }
fontatlas-broker = { path = "crates/fontatlas-broker" }
fontatlas-cep = { path = "crates/fontatlas-cep" }
fontatlas-core = { path = "crates/fontatlas-core" }
fontatlas-describe = { path = "crates/fontatlas-describe" }
fontatlas-embed = { path = "crates/fontatlas-embed" }
fontatlas-fontreq = { path = "crates/fontatlas-fontreq" }
fontatlas-indesign = { path = "crates/fontatlas-indesign" }
fontatlas-index = { path = "crates/fontatlas-index" }
fontatlas-preview = { path = "crates/fontatlas-preview" }
fontatlas-store = { path = "crates/fontatlas-store" }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "=1.8.7"
tauri = { version = "2.9.5", features = ["macos-private-api"] }
base64 = "0.22"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
thiserror = "2"
unicode-normalization = "0.1.25"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
# Theo dõi thư mục nguồn cloud (chỉ để đánh thức quét lại). Khoá phiên bản chính xác, chỉ bật backend macOS FSEvents.
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }

# Chỉ dùng cho QA bản debug (chụp webview của chính app, không cần quyền ghi màn hình).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSProcessInfo", "NSString", "NSFileManager", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSGlassEffectView", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKPreferences", "block2", "objc2-app-kit"] }

[dev-dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled"] }
tauri = { version = "2.9.5", features = ["macos-private-api", "test"] }
tempfile = "3.27"
tiny_http = "0.12"

[workspace]
members = [".", "crates/fontatlas-core", "crates/fontatlas-store", "crates/fontatlas-embed", "crates/fontatlas-index", "crates/fontatlas-eval", "crates/fontatlas-preview", "crates/fontatlas-activate", "crates/fontatlas-broker", "crates/fontatlas-fontreq", "crates/fontatlas-cep", "crates/fontatlas-indesign", "crates/fontatlas-describe"]
resolver = "2"

# Sinh khoá RSA 2048 ở bản debug (test, QA) rất chậm nếu không tối ưu phần số lớn.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
