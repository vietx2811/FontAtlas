[package]
name = "fontatlas-activate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Kích hoạt font cho mọi app (CoreText tại chỗ, theo scope); đối soát với hệ điều hành"

[dependencies]
blake3 = "=1.8.7"
fontatlas-store = { path = "../fontatlas-store" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
fontatlas-core = { path = "../fontatlas-core" }
serde_json = "1"
tempfile = "3.27"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-text = { version = "=0.3.2", features = ["CTFontManager", "CTFontManagerErrors", "CTFontDescriptor", "CTFont"] }
objc2-core-foundation = { version = "=0.3.2", features = ["CFURL", "CFArray", "CFString", "CFError", "CFDictionary", "CFSet"] }
