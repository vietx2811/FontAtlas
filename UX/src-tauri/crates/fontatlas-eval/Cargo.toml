[package]
name = "fontatlas-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Bộ đánh giá Similar/Pairing và dựng thư viện tham chiếu"

[dependencies]
csv = "1.3"
fontatlas-core = { path = "../fontatlas-core" }
fontatlas-index = { path = "../fontatlas-index" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"
