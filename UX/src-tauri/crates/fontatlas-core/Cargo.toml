[package]
name = "fontatlas-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Phân tích font: nạp, metadata, phủ tiếng Việt, trục giải phẫu"

[dependencies]
blake3 = "=1.8.7"
kurbo = "=0.13.1"
rayon = "1.12"
read-fonts = "=0.45.1"
serde = { version = "1", features = ["derive"] }
skrifa = "=0.48.0"
thiserror = "2"
wuff = "=0.2.9"

[dev-dependencies]
blake3 = "=1.8.7"
serde_json = "1"
