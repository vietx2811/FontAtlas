[package]
name = "fontatlas-cep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Panel CEP nền cho Illustrator: ký gói kiểu ZXP bằng chứng chỉ tự ký của từng máy, cài và gỡ trong thư mục extensions của Adobe"

[dependencies]
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27"
