[package]
name = "fontatlas-embed"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Embedding ảnh font: render chuỗi mẫu, SigLIP 2 qua candle, whitening, hàng đợi nền"

[features]
fit = ["dep:nalgebra"]

[dependencies]
blake3 = "=1.8.7"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
fontatlas-core = { path = "../fontatlas-core" }
fontatlas-store = { path = "../fontatlas-store" }
nalgebra = { version = "=0.35.0", optional = true }
rayon = "1.12"
read-fonts = "=0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "=0.4.3"
sha2 = "0.10"
skrifa = "=0.48.0"
thiserror = "2"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.11.0", features = ["accelerate", "metal"] }
candle-nn = { version = "=0.11.0", features = ["accelerate", "metal"] }
candle-transformers = { version = "=0.11.0", features = ["accelerate", "metal"] }

[dev-dependencies]
png = "=0.18.1"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
tempfile = "3.27"
tiny_http = "0.12"

[[bin]]
name = "whitenfit"
required-features = ["fit"]
