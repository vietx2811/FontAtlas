<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FontAtlas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'editorial': ['"Times New Roman"', 'Times', 'serif'],
            'mono-code': ['"SF Mono"', '"Menlo"', '"Monaco"', '"Courier New"', 'monospace'],
          },
          keyframes: {
            'text-slide': {
              '0%, 100%': { opacity: '0', transform: 'translateY(10px)' },
              '10%, 90%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'text-slide': 'text-slide 6s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <style>
    /* Editorial Font Stacks */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-editorial {
      font-family: "Times New Roman", Times, serif;
    }

    .font-mono-code {
      font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    /* Hide scrollbar for clean aesthetic in panels */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }
  </style>
</head>

<body class="bg-stone-50 text-stone-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
