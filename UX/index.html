<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FontAtlas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'editorial': ['"Times New Roman"', 'Times', 'serif'],
            'mono-code': ['"SF Mono"', '"Menlo"', '"Monaco"', '"Courier New"', 'monospace'],
          },
          keyframes: {
            'text-slide': {
              '0%, 100%': { opacity: '0', transform: 'translateY(10px)' },
              '10%, 90%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'text-slide': 'text-slide 6s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <style>
    /* Editorial Font Stacks */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-editorial {
      font-family: "Times New Roman", Times, serif;
    }

    .font-mono-code {
      font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
    }

    /* Hide scrollbar for clean aesthetic in panels */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* ========================================
       SLEEK CUSTOM SCROLLBARS
       ======================================== */

    /* Firefox */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 113, 108, 0.3) transparent;
    }

    /* Webkit (Chrome, Safari, Edge) */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(120, 113, 108, 0.3);
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(120, 113, 108, 0.5);
    }

    ::-webkit-scrollbar-thumb:active {
      background: rgba(120, 113, 108, 0.7);
    }

    /* Scrollbar for specific components */

    /* Sidebar - Slightly darker */
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: rgba(87, 83, 78, 0.4);
    }

    .sidebar-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(87, 83, 78, 0.6);
    }

    /* Font Grid - Ultra minimal */
    .grid-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .grid-scroll::-webkit-scrollbar-thumb {
      background: rgba(168, 162, 158, 0.25);
      border-radius: 3px;
    }

    .grid-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 162, 158, 0.4);
    }

    /* Detail Panel - Elegant */
    .detail-scroll::-webkit-scrollbar-thumb {
      background: rgba(214, 211, 209, 0.4);
    }

    .detail-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(214, 211, 209, 0.6);
    }

    /* Dark mode support (if implemented) */
    @media (prefers-color-scheme: dark) {
      * {
        scrollbar-color: rgba(214, 211, 209, 0.3) transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(214, 211, 209, 0.3);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(214, 211, 209, 0.5);
      }

      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: rgba(231, 229, 228, 0.4);
      }

      .sidebar-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(231, 229, 228, 0.6);
      }

      .grid-scroll::-webkit-scrollbar-thumb {
        background: rgba(168, 162, 158, 0.3);
      }

      .grid-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 162, 158, 0.5);
      }

      .detail-scroll::-webkit-scrollbar-thumb {
        background: rgba(120, 113, 108, 0.4);
      }

      .detail-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(120, 113, 108, 0.6);
      }
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="bg-stone-50 text-stone-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
