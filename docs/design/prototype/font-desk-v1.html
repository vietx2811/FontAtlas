<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FontAtlas · Plates — prototype v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;600;700&family=Alegreya:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:ital,wght@0,400;0,600;0,800;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&family=Oswald:wght@300;400;500;600;700&family=Roboto+Slab:wght@300;400;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Abril+Fatface&family=Space+Mono:wght@400;700&display=swap">
<style>
/*
  Prototype cho tính năng Plates (tên tạm "Font Desk"). Spec: docs/design/font-desk/04_spec.md
  - Font Google là stand-in cho font trong thư viện người dùng. Số đo trục và nhãn ●◐◆○ ở đây là DỮ LIỆU GIẢ,
    tính bằng luật rút gọn mô phỏng R1–R9; app thật lấy từ pair_candidates / assess_pair.
  - DM Serif Display và Abril Fatface không có bộ ký tự tiếng Việt trên Google Fonts: dùng để minh hoạ cảnh báo thiếu ký tự.
  - Dữ liệu tự lưu vào localStorage (mô phỏng user.db).
*/
:root{
  --chrome:#F1EFEC; --chrome-hover:rgba(41,37,36,.06); --chrome-active:rgba(41,37,36,.09);
  --sheet:#FAFAFA; --card:#FFFFFF; --page:#FFFFFF; --fg:#2A2A2A; --muted:#78716C; --border:#E7E5E4; --surface-2:#F3F2F0;
  --accent:#D4A574; --accent-ink:#9A6B3C; --accent-soft:#F5E6D3; --on:#3FA66B; --warn:#C2410C;
  --shadow:0 1px 2px rgba(41,37,36,.05),0 8px 24px rgba(41,37,36,.08);
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side-w:240px; --ledger-w:264px; --tray-h:252px;
  --r-sm:7px; --r-md:10px; --r-lg:14px;
}
@media (max-width:1279px){ :root{ --side-w:216px; --ledger-w:224px; } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--fg);font:13px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;min-width:1000px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100vh;padding:8px 8px 8px 0}
.side{display:flex;flex-direction:column;min-height:0;padding:0 8px}
.side-top{height:36px;display:flex;align-items:center;justify-content:flex-end;padding-right:4px;color:var(--muted)}
.side-scroll{flex:1;overflow:auto;scrollbar-width:none;padding-bottom:12px}
.nav{display:flex;align-items:center;gap:11px;width:100%;height:32px;padding:0 9px;border-radius:var(--r-sm);text-align:left;font-size:14px;white-space:nowrap}
.nav:hover{background:var(--chrome-hover)}
.nav[aria-current="true"]{background:var(--chrome-active);font-weight:500}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .ico{opacity:.75}
.sec{margin-top:16px}
.sec-head{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;color:var(--muted);font-size:13px;font-weight:500;border-radius:var(--r-sm);width:100%;text-align:left}
.sec-head:hover{color:var(--fg)}
.tri{width:0;height:0;border-top:5px solid currentColor;border-left:4px solid transparent;border-right:4px solid transparent}
.sec-head .sp{flex:1}
.sec-add{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--muted);opacity:0}
.sec:hover .sec-add,.sec-add:focus-visible{opacity:1}
.sec-add:hover{background:var(--chrome-hover);color:var(--fg)}
.nav.plate-nav{font-size:13.5px}
.nav.sub{color:var(--muted);font-size:12.5px}
.plate-ico{width:14px;height:16px;border:1.4px solid currentColor;border-radius:2px;position:relative;opacity:.7;flex:none}
.plate-ico::after{content:"";position:absolute;left:2px;right:2px;top:3px;height:1.4px;background:currentColor;box-shadow:0 3px 0 currentColor,0 6px 0 currentColor}
.side-foot{display:flex;gap:4px;padding:6px 4px;color:var(--muted)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted)}
.iconbtn:hover{background:var(--chrome-hover);color:var(--fg)}

.main{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);min-width:0;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}

/* ---------- Library (minimal, for context-menu entry point) ---------- */
.lib-top{height:52px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
.lib-top h1{font-size:15px;margin:0;font-weight:600}
.lib-top .n{color:var(--muted)}
.lib-top .hint{margin-left:auto;color:var(--muted);font-size:12px}
.lib-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-content:start}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 14px 10px;text-align:left;display:flex;flex-direction:column;gap:18px;min-height:132px}
.fcard:hover{border-color:#D6D3D1}
.fcard[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fcard .spec{font-size:30px;line-height:1.15;white-space:nowrap;overflow:hidden}
.fcard .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.vi-miss{color:var(--warn)}
.vi-ok{color:var(--on)}

/* ---------- Plates home (zerostate) ---------- */
.home{flex:1;overflow:auto;padding:44px 56px 56px}
.home-in{max-width:980px;margin:0 auto}
.home h1{font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.home .lede{color:var(--muted);margin:0 0 28px;font-size:13.5px;max-width:520px}
.start{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 24px;display:grid;gap:14px}
.start.drag{border-color:var(--accent);background:#FFFCF8}
.start h2{margin:0;font-size:15px;font-weight:600}
.start-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.start-row .k{width:68px;color:var(--muted);font-size:12px}
.seed-search{flex:1;min-width:260px;position:relative}
.seed-search input{width:100%;height:38px;border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px 0 34px;background:var(--sheet)}
.seed-search .ico{position:absolute;left:11px;top:11px;color:var(--muted)}
.seed-results{position:absolute;left:0;right:0;top:42px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);z-index:5;max-height:260px;overflow:auto;padding:4px}
.seed-results button{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:8px 10px;border-radius:6px;text-align:left}
.seed-results button:hover,.seed-results button:focus-visible{background:var(--surface-2)}
.seed-results .s{font-size:20px}
.chip{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--border);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#D6D3D1}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.drop-hint{color:var(--muted);font-size:12px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px}
.list-head h3{margin:0;font-size:13px;font-weight:600}
.list-head .muted{color:var(--muted);font-size:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:8px}
.pthumb{aspect-ratio:16/10;background:var(--page);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;position:relative;padding:14px 16px}
.pcard:hover .pthumb{border-color:#CFCBC8}
.pthumb .t1{font-size:19px;line-height:1.05}
.pthumb .t2{font-size:9px;margin-top:8px;line-height:1.45;color:#444}
.pthumb .t3{font-size:7.5px;letter-spacing:.14em;color:#777;margin-bottom:8px}
.pcard .nm{font-weight:500;display:flex;gap:6px;align-items:center}
.pcard .sub{font-size:11.5px;color:var(--muted)}
.star{color:var(--accent-ink)}
.empty-note{color:var(--muted);font-size:12.5px;padding:18px 0}

/* ---------- Plate workspace ---------- */
.ws{flex:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.tray{min-width:0}
.bar{height:50px;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;border-bottom:1px solid var(--border);min-width:0;overflow:hidden}
.pname{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;padding:3px 5px;border-radius:5px;outline:none}
.pname:hover{background:var(--chrome-hover)}
.pname:focus{background:var(--card);box-shadow:0 0 0 1px var(--border)}
.starbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--muted);font-size:16px}
.starbtn[aria-pressed="true"]{color:var(--accent-ink)}
.starbtn:hover{background:var(--chrome-hover)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:2px;border-radius:9px}
.tabs button{height:28px;padding:0 11px;border-radius:7px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.tabs .p1{font-size:9.5px;color:var(--muted);margin-left:3px;vertical-align:1px}
.bar .sp{flex:1}
.tog{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.tog:hover{background:var(--chrome-hover);color:var(--fg)}
.tog .sw{width:24px;height:14px;border-radius:99px;background:#D6D3D1;position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .15s}
.tog[aria-checked="true"]{color:var(--fg)}
.tog[aria-checked="true"] .sw{background:var(--accent-ink)}
.tog[aria-checked="true"] .sw::after{left:12px}
.depth{display:flex;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.depth button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.depth button i{width:7px;height:7px;border-radius:50%;border:1.4px solid var(--muted);display:block}
.depth button[aria-pressed="true"] i{background:var(--accent-ink);border-color:var(--accent-ink)}
.depth button:hover{background:var(--chrome-hover)}
.saved{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:64px;text-align:right}
.saved.busy{color:var(--accent-ink)}
@media (max-width:1279px){ .tog .t-l,.tabs .p1,.saved{display:none} .tabs button{padding:0 7px} .pname{max-width:140px} .bar{gap:8px} .src button{padding:0 7px} .t-title{display:none} }

.body{display:grid;grid-template-columns:minmax(0,1fr) var(--ledger-w);min-height:0}
.canvas{overflow:auto;padding:26px 28px 32px;position:relative;background:var(--sheet)}
.trying-note{position:sticky;top:-10px;z-index:3;margin:-14px auto 10px;width:max-content;max-width:100%;background:var(--fg);color:#fff;font-size:12px;padding:6px 12px;border-radius:99px;box-shadow:var(--shadow)}
.ledger{border-left:1px solid var(--border);overflow:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:6px;background:var(--sheet)}

/* page */
.page{background:var(--page);border:1px solid var(--border);margin:0 auto;color:#1F1D1B;position:relative}
.role{position:relative;border-radius:3px;cursor:default;transition:box-shadow .1s}
.role:hover{box-shadow:0 0 0 1px rgba(154,107,60,.28)}
.role.sel{box-shadow:0 0 0 1px var(--accent-ink);box-shadow:0 0 0 1px transparent;outline:1px dashed var(--accent-ink);outline-offset:5px}
.role.try{box-shadow:-6px 0 0 -4px var(--accent)}
.role.prov{color:#5b5753}
.role[contenteditable="true"]{outline:1px solid var(--accent-ink);outline-offset:5px;cursor:text;background:#FFFCF8}
.role-tag{position:absolute;right:100%;margin-right:14px;top:2px;font:500 10px/1 var(--font-ui);letter-spacing:.02em;color:var(--accent-ink);white-space:nowrap;opacity:0;pointer-events:none;font-style:normal;text-transform:none}
.role:hover .role-tag{opacity:1}
.miss{background:rgba(194,65,12,.14);box-shadow:inset 0 -2px 0 var(--warn);border-radius:1px}

/* menu */
.pg-menu{width:min(100%,600px);padding:52px 60px 46px}
.pg-menu .head{text-align:center;margin-bottom:34px}
.pg-menu .addr{margin-top:10px}
.pg-menu .rule{height:1px;background:#1F1D1B;opacity:.85;margin:0 0 26px}
.pg-menu .sect{margin:0 0 14px}
.pg-menu .group{margin-bottom:28px}
.dish{margin-bottom:14px}
.dish .line{display:flex;align-items:baseline;gap:8px}
.dish .lead{flex:1;border-bottom:1.5px dotted #9b9690;transform:translateY(-4px);min-width:20px}
.dish.inline .line{display:block}
.dish.inline .price{margin-left:10px}
.dish .desc{margin-top:3px;max-width:88%}
.pg-menu .foot{margin-top:30px;text-align:center}
.price-tg{position:absolute;right:10px;top:10px;font:11px var(--font-ui);color:var(--muted);display:flex;gap:4px;align-items:center}
.price-tg button{padding:2px 7px;border-radius:5px;border:1px solid var(--border)}
.price-tg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* sign */
.pg-sign{width:min(100%,640px);padding:44px 48px;display:grid;grid-template-columns:auto 1fr;gap:6px 30px;align-items:center}
.pg-sign .num{grid-row:span 3;border-right:1.5px solid #1F1D1B;padding-right:28px}
.distances{width:min(100%,640px);margin:18px auto 0;display:flex;gap:16px;align-items:flex-end;font:11px var(--font-ui);color:var(--muted)}
.distances figure{margin:0;display:flex;flex-direction:column;gap:6px}
.distances .mini{background:var(--page);border:1px solid var(--border);overflow:hidden}

/* pack */
.pg-pack{width:min(100%,520px);aspect-ratio:4/3.3;padding:34px 38px;display:flex;flex-direction:column;border-radius:4px}
.pg-pack .frame{border:1.5px solid #1F1D1B;flex:1;padding:24px 26px;display:flex;flex-direction:column;gap:6px;text-align:center;justify-content:center}
.pg-pack .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:18px;text-align:left;gap:16px}

/* brand */
.pg-brand{width:min(100%,760px);padding:42px 48px;display:grid;grid-template-columns:1.1fr 1fr;gap:28px 40px}
.pg-brand .full{grid-column:1/-1}
.aa{display:flex;flex-direction:column;gap:6px;border-top:1px solid #1F1D1B;padding-top:10px}
.aa .big{font-size:64px;line-height:1}
.aa .set{font-size:15px;letter-spacing:.04em;line-height:1.5;word-break:break-all}
.aa .cap{font:500 10px var(--font-ui);color:#77716B;letter-spacing:.06em;text-transform:uppercase}

/* editorial */
.pg-ed{width:min(100%,640px);padding:50px 56px}
.pg-ed .cols{columns:2;column-gap:26px;margin-top:22px}
.pg-ed .cols p{margin:0 0 10px}
.pg-ed blockquote{margin:18px 0;padding:0;break-inside:avoid}

/* ledger */
.l-head{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500;padding:2px 4px 6px}
.voice{border-radius:var(--r-md);padding:10px 10px 10px;display:flex;flex-direction:column;gap:5px;border:1px solid transparent}
.voice:hover{background:var(--card);border-color:var(--border)}
.voice.active{background:var(--card);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.voice.drop{border-color:var(--accent-ink);border-style:dashed;background:#FFFCF8}
.v-top{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.v-idx{width:17px;height:17px;border-radius:50%;border:1.2px solid currentColor;display:grid;place-items:center;font-size:10px;font-weight:600}
.voice.active .v-idx{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.v-top .sp{flex:1}
.v-more{width:22px;height:22px;border-radius:5px;display:grid;place-items:center}
.v-more:hover{background:var(--chrome-hover)}
.v-font{font-size:19px;line-height:1.15;color:var(--fg);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-meta{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.anchor{display:inline-flex;align-items:center;gap:3px;color:var(--accent-ink);font-weight:500}
.prov-tag{color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:1px 5px}
.labels{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px}
.lab{white-space:nowrap;color:#57534E}
.lab b{font-weight:400;margin-right:3px;color:var(--fg)}
.lab.k{color:var(--warn)} .lab.k b{color:var(--warn)}
.lab.u{color:var(--muted)}
.roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.rchip{font-size:11px;height:22px;padding:0 8px;border-radius:99px;background:var(--surface-2);color:#57534E;cursor:grab}
.rchip:hover{color:var(--fg);background:#ECEAE7}
.rchip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.add-voice{margin-top:2px;height:34px;border:1px dashed #D6D3D1;border-radius:var(--r-md);color:var(--muted);font-size:12px}
.add-voice:hover,.add-voice.drop{border-color:var(--accent-ink);color:var(--accent-ink)}
.warn3{font-size:11px;color:var(--muted);padding:0 4px}
.vi-block{margin-top:auto;border-top:1px solid var(--border);padding:12px 4px 0;font-size:12px;display:flex;flex-direction:column;gap:6px}
.vi-block .t{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.vi-line{display:flex;gap:6px;align-items:baseline}
.vi-line .ch{font-size:14px;letter-spacing:.08em}
.linkbtn{color:var(--accent-ink);font-size:12px;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(154,107,60,.4)}

/* tray */
.tray{border-top:1px solid var(--border);background:var(--card);height:var(--tray-h);display:flex;flex-direction:column;min-height:0;transition:height .18s ease}
.tray.closed{height:42px}
.tray.deep{--tray-h:330px}
.t-head{height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px 0 18px;min-width:0}
.t-title{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.t-title b{color:var(--fg);font-weight:600}
.src{display:flex;gap:2px}
.src button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.src button:hover{color:var(--fg);background:var(--chrome-hover)}
.src button[aria-pressed="true"]{color:var(--fg);background:var(--surface-2);font-weight:500}
.t-head .sp{flex:1}
.modes{display:flex;gap:2px;background:var(--surface-2);padding:2px;border-radius:8px}
.modes button{height:24px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* =========================================================================
   NHÃN TRỤC GIẢ (mô phỏng rút gọn R1–R9) — app thật: pair_candidates / assess_pair
   ========================================================================= */
function axes(a, b){
  const out = [];
  const ln = (x,y) => Math.abs(Math.log(x/y));
  const same = GROUP(a) === GROUP(b);
  const sf = (a.sf && a.sf === b.sf) || a.id === b.id;
  // cấu trúc
  const dx = ln(b.xh, a.xh); out.push({k:'xh', n:'x-height', g:'s', sym: dx < .10 ? '●' : '◐', va:a.xh, vb:b.xh, fmt:v=>v.toFixed(2).replace('.',',')});
  const dw = ln(b.wd, a.wd); out.push({k:'wd', n:'độ rộng', g:'s', sym: dw < .10 ? '●' : dw > .25 ? '◐' : '◆', va:a.wd, vb:b.wd, fmt:v=>v.toFixed(2).replace('.',',')});
  if (a.lowConf || b.lowConf) out.push({k:'ap', n:'độ mở', g:'s', sym:'○', va:null, vb:null});
  // biểu cảm
  out.push({k:'sf', n:'chân', g:'e', sym: same ? '●' : '◐', va:null, vb:null, txt:`${CLS_VI[GROUP(a)]} · ${CLS_VI[GROUP(b)]}`});
  const dc = ln(b.ct, a.ct);
  let csym = dc < .20 ? '●' : dc > .70 ? '◐' : (!same ? '◐~' : '◆');
  out.push({k:'ct', n:'tương phản nét', g:'e', sym:csym, va:a.ct, vb:b.ct, fmt:v=>v.toFixed(1).replace('.',',')});
  // va chạm toàn cục (R7) và cùng da khác khung (R8)
  const expr = out.filter(x => x.g === 'e');
  const exprC = expr.some(x => x.sym === '◐');
  const structAllH = out.filter(x => x.g === 's').every(x => x.sym === '●' || x.sym === '○');
  if (!sf && same && !exprC && structAllH) out.push({k:'gl', n:'gần như nhau', g:'x', sym:'◆', glob:true});
  else if (!sf && same && !exprC && out.some(x => x.g === 's' && x.sym === '◐')) out.push({k:'r8', n:'khung khác, da giống', g:'x', sym:'◆', glob:true});
  if (sf && a.id !== b.id) out.unshift({k:'fam', n:'cùng superfamily', g:'m', sym:'●'});
  return out;
}
function assess(ref, cand, viText, projectVi){
  const ax = axes(ref, cand);
  const miss = missingIn(cand, viText);
  const K = ax.filter(x => x.sym === '◆');
  const sHarm = ax.filter(x => x.g === 's' && x.sym === '●').length;
  const sf = ax.some(x => x.k === 'fam') || ref.id === cand.id;
  const exprC = ax.some(x => x.g === 'e' && x.sym === '◐');
  let gate = 'experimental';
  if (sf || (K.length === 0 && ax.filter(x => x.g === 's').every(x => x.sym === '●' || x.sym === '○'))) gate = 'safe';
  else if (K.length <= 1 && K.every(x => x.k === 'wd') && exprC) gate = 'controlled';
  const kept = ax.filter(x => x.sym === '●' && x.g !== 'm').map(x => x.n);
  const changed = ax.filter(x => x.sym.startsWith('◐')).map(x => x.n);
  let sum;
  if (ax.some(x => x.k === 'gl')) sum = 'Khác họ nhưng gần như nhau: dễ trông như chọn nhầm.';
  else if (ax.some(x => x.k === 'r8')) sum = 'Bề mặt giống, khung chữ khác: đứng cạnh nhau thấy lệch.';
  else if (sf && ref.id !== cand.id) sum = 'Cùng gốc thiết kế: tỉ lệ và nhịp sẵn khớp.';
  else sum = (kept.length ? 'Giữ: ' + kept.slice(0,2).join(', ') + '. ' : '') + (changed.length ? 'Đổi: ' + changed.slice(0,2).join(', ') + '.' : 'Rất gần nhau.');
  const labels = [];
  if (miss.length) labels.push({sym:'◆', n:`thiếu ${miss.slice(0,3).join(' ')}${miss.length > 3 ? '…' : ''}`, vi:true});
  ax.filter(x => x.sym === '◆').forEach(x => labels.push(x));
  ax.filter(x => x.sym !== '◆').forEach(x => labels.push(x));
  return {ax, gate, K:K.length + (miss.length ? 1 : 0), sHarm, sf, sum, labels, miss, blocked: projectVi && (miss.length > 0 || cand.noVi)};
}
const GATE_VI = {safe:'An toàn', controlled:'Có kiểm soát', experimental:'Thử nghiệm'};
const GATE_ORDER = {safe:0, controlled:1, experimental:2};
const PAIR_STYLES = [
  ['all','Mọi kiểu ghép'], ['family','Cùng họ'], ['serifsans','Có chân + không chân'], ['displaytext','Trưng bày + đọc'],

];
function styleOk(style, ref, c, r){
  switch(style){
    case 'family': return r.sf;
    case 'serifsans': return r.ax.some(x => x.k === 'sf' && x.sym === '◐') && r.K === 0;
    case 'displaytext': return (ref.sub === 'display' || ref.ct > 4) && c.ct < 2.7 && c.xh >= .45;
    case 'keepone': return r.sHarm >= 1 && r.ax.some(x => x.g === 'e' && x.sym === '◐') && r.K === 0;
    case 'break': return r.K > 0;
    default: return true;
  }
}

/* =========================================================================
   DANH SÁCH ỨNG VIÊN CHO KHAY
   ========================================================================= */
function voiceText(p, slot, layout){
  const L = LAYOUTS[layout || p.layout], t = {...L.text, ...(p.texts[layout || p.layout] || {})};
  let s = '';
  for (const [k, val] of Object.entries(t)) {
    const role = keyRole(k);
    if (role && roleSlot(p, role) === slot) s += ' ' + (ROLE[role].up ? val.toUpperCase() : val);
  }
  return s;
}
function keyRole(k){ if (ROLE[k]) return k; return {s1:'section',s2:'section',i1:'item',i2:'item',i3:'item',i4:'item',i5:'item',p1:'price',p2:'price',p3:'price',p4:'price',p5:'price',d1:'body',d2:'body',d3:'body',d4:'body',d5:'body',b1:'body',b2:'body'}[k] || null; }
function refFor(p, slot){ return slot === 1 ? voice(p,2) : voice(p,1); }
function pairList(p, slot, ignoreStyle){
  const ref = F[refFor(p, slot)?.font || voice(p,1).font];
  const txt = voiceText(p, slot);
  const curFont = voice(p, slot)?.font;
  if (p.projectVi && ref.noVi && slot !== 1) return []; // H1: neo thiếu tiếng Việt → backend trả rỗng
  let list = FONTS.filter(f => f.id !== ref.id).map(f => ({f, r:assess(ref, f, txt, p.projectVi), src:'Ghép'}));
  list = list.filter(x => !x.r.blocked); // H1: dự án tiếng Việt chặn ở nguồn Ghép
  const lim = GATE_ORDER[p.mode];
  list = list.filter(x => GATE_ORDER[x.r.gate] <= lim);
  if (!ignoreStyle && p.style !== 'all') list = list.filter(x => styleOk(p.style, ref, x.f, x.r));
  list.sort((a,b) => (b.r.sf - a.r.sf) || (a.r.K - b.r.K) || (b.r.sHarm - a.r.sHarm) || GATE_ORDER[a.r.gate] - GATE_ORDER[b.r.gate] || a.f.fam.localeCompare(b.f.fam));
  if (slot === 3) { const r2 = F[voice(p,2).font]; list.forEach(x => x.r2 = assess(r2, x.f, txt, p.projectVi)); }
  return list.map(x => ({...x, current: x.f.id === curFont}));
}
function similarList(p, slot){
  const base = F[voice(p, slot).font];
  const ref = F[refFor(p, slot)?.font || base.id];
  const txt = voiceText(p, slot);
  const d = f => Math.abs(Math.log(f.xh/base.xh))/.1 + Math.abs(Math.log(f.ct/base.ct))/.5 + Math.abs(Math.log(f.wd/base.wd))/.15 + (GROUP(f)!==GROUP(base)?2.5:0) + (f.sub!==base.sub?.8:0);
  return FONTS.filter(f => f.id !== base.id).sort((a,b) => d(a)-d(b)).slice(0,7).map(f => {
    const r = assess(ref, f, txt, p.projectVi);
    const ax = axes(base, f);
    const same = ax.filter(x => x.sym === '●' && x.g !== 'm').map(x => x.n).slice(0,2), diff = ax.filter(x => x.sym !== '●' && x.sym !== '○' && x.g !== 'x').map(x => x.n).slice(0,2);
    r.sum = `Giống ${esc(base.fam)} ở ${same.join(', ') || '—'}${diff.length ? '; khác ở ' + diff.join(', ') : ''}.`;
    return {f, r, src:'Giống'};
  });
}
function familyList(p, slot){
  const base = F[voice(p, slot).font];
  const ref = F[refFor(p, slot)?.font || base.id];
  const txt = voiceText(p, slot);
  const out = [];
  const steps = [[-100,'Light'],[0,'Regular'],[100,'Medium'],[200,'Bold']];
  const v = voice(p, slot);
  steps.forEach(([adj, nm]) => out.push({f:base, wAdj:adj, styleName:nm, r:assess(ref, base, txt, p.projectVi), src:'Cùng họ', current: v.font===base.id && v.wAdj===adj}));
  FONTS.filter(f => f.sf && f.sf === base.sf && f.id !== base.id).forEach(f => out.push({f, wAdj:0, r:assess(ref, f, txt, p.projectVi), src:'Superfamily'}));
  out.forEach(x => { if (x.styleName) x.r = {...x.r, sum: `Kiểu ${x.styleName} của ${base.fam}.`} });
  return out;
}
function libList(p, slot){
  const ref = F[refFor(p, slot)?.font || voice(p,1).font];
  const txt = voiceText(p, slot); const q = ui.libQ.trim().toLowerCase();
  return FONTS.filter(f => !q || f.fam.toLowerCase().includes(q)).map(f => ({f, r:assess(ref, f, txt, p.projectVi), src:'Thư viện', current:f.id===voice(p,slot)?.font}));
}
function pinnedList(p, slot){
  const ref = F[refFor(p, slot)?.font || voice(p,1).font];
  const txt = voiceText(p, slot);
  return (p.pinned[slot] || []).map(x => ({f:F[x.font], r:assess(ref, F[x.font], txt, p.projectVi), src: x.prev ? 'Đã dùng trước' : x.lib ? 'Từ thư viện' : 'Đã ghim', note:x.note}));
}
function trayList(p){
  const slot = activeSlot(p);
  if (!voice(p, slot)) return [];
  switch(p.tab){
    case 'similar': return similarList(p, slot);
    case 'family': return familyList(p, slot);
    case 'lib': return libList(p, slot);
    case 'pinned': return pinnedList(p, slot);

  }
}
const activeSlot = p => roleSlot(p, p.sel || 'body');

/* =========================================================================

   ========================================================================= */
function fontFor(p, slot){
  const v = voice(p, slot);
  if (ui.preview && ui.preview.slot === slot) return {f:F[ui.preview.font], wAdj: ui.preview.wAdj ?? v.wAdj, trying:true};
  return {f:F[v.font], wAdj:v.wAdj, prov:v.provisional};
}
function roleEl(p, key, tag='div', extraStyle=''){
  const role = keyRole(key), R = ROLE[role], L = LAYOUTS[p.layout];
  const slot = roleSlot(p, role);
  const {f, wAdj, trying, prov} = fontFor(p, slot);
  const t = (p.texts[p.layout] || {})[key] ?? L.text[key];
  const text = R.up ? t.toUpperCase() : t;
  const size = L.base * Math.pow(L.ratio, (L.steps && L.steps[role]) ?? R.step);
  const w = Math.max(f.w[0], Math.min(f.w[1], R.w + wAdj));
  const miss = missingIn(f, text);
  const body = (ui.highlight && miss.length) ? [...text].map(c => miss.includes(c) ? `<span class="miss">${esc(c)}</span>` : esc(c)).join('') : esc(text);
  const style = `font-family:${esc(fstack(f))};font-size:${size.toFixed(1)}px;font-weight:${w};line-height:${R.lh};letter-spacing:${R.tr||0}em;${R.it && f.it ? 'font-style:italic;' : ''}${R.num ? 'font-variant-numeric:tabular-nums;' : ''}${p.xnorm ? 'font-size-adjust:0.52;' : ''}${extraStyle}`;
  const cls = ['role', p.sel === role ? 'sel' : '', trying ? 'try' : '', prov ? 'prov' : ''].join(' ');
  const label = `${R.n} — ${f.fam}`;
  const editing = ui.editing === key;
  return `<${tag} class="${cls}" data-role="${role}" data-key="${key}" tabindex="0" role="group" aria-label="${esc(label)}" style="${style}"${editing ? ' contenteditable="true"' : ''} data-drop-role="${role}"><span class="role-tag" contenteditable="false">${esc(R.n)}</span>${body}</${tag}>`;
}
function pageHTML(p){

      const dish = i => `<div class="dish ${p.priceStyle==='inline'?'inline':''}"><div class="line">${r('i'+i,'span')}${p.priceStyle==='leader' ? '<span class="lead" aria-hidden="true"></span>' : ''}${r('p'+i,'span','white-space:nowrap')}</div><div class="desc">${r('d'+i)}</div></div>`;

function dumbbell(va, vb, lo, hi){

  const x = v => 4 + 92 * Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
  return `<svg viewBox="0 0 100 10" aria-hidden="true"><line x1="2" y1="5" x2="98" y2="5" stroke="#ECEAE7"/><line x1="${x(va)}" y1="5" x2="${x(vb)}" y2="5" stroke="#A8A29E" stroke-width="1.5"/><circle cx="${x(va)}" cy="5" r="3.2" fill="#C9A57E"/><circle cx="${x(vb)}" cy="5" r="3.2" fill="#2A2A2A"/></svg>`;
}
const RANGE = {xh:[.38,.6], wd:[.7,1.2], ct:[1,6]};

function trayHTML(p){

function setVoice(p, slot, fontId, wAdj=0){
  const v = voice(p, slot); if (!v) return;
  if (v.font !== fontId && !v.provisional) {
    p.pinned[slot] = (p.pinned[slot] || []).filter(x => x.font !== v.font);
    p.pinned[slot].unshift({font:v.font, prev:true});
  }
  p.pinned[slot] = (p.pinned[slot] || []).filter(x => x.font !== fontId);
  v.font = fontId; v.wAdj = wAdj; delete v.provisional;
  ui.preview = null; touch(true); render();
  live(`Đã đặt ${F[fontId].fam} cho giọng ${slot}.`);
}
function togglePin(p, slot, fontId){
  const arr = p.pinned[slot] = p.pinned[slot] || [];
  const i = arr.findIndex(x => x.font === fontId);
  if (i >= 0) arr.splice(i, 1); else arr.unshift({font:fontId});
  touch(); render();
}
function addVoice(p, fontId){
  const slot = Math.max(...p.voices.map(v => v.slot)) + 1;
  const src = voice(p, 2) || voice(p, 1);
  p.voices.push({slot, font: fontId || src.font, wAdj:0});
  const role = p.sel && p.sel !== 'wordmark' ? p.sel : (LAYOUTS[p.layout].roles.includes('price') ? 'price' : 'eyebrow');
  p.roleVoice[role] = slot; p.sel = role; p.tab = 'pair';
  touch(true); render();
  live(`Đã thêm giọng ${slot} cho vai ${ROLE[role].n}.`);
}
function startTry(i){
  const p = cur(); const x = ui.list?.[i]; if (!p || !x) return;
  const slot = activeSlot(p);
  if (ui.preview && ui.preview.font === x.f.id && (ui.preview.wAdj ?? 0) === (x.wAdj ?? 0)) return;
  ui.preview = {slot, font:x.f.id, wAdj:x.wAdj ?? voice(p, slot).wAdj}; ui.focus = i;
  rerenderKeepScroll(); live(`Đang thử ${x.f.fam}.`);
}
function endTry(){ if (!ui.preview) return; ui.preview = null; rerenderKeepScroll(); }
function rerenderKeepScroll(){
  const c = $('#cards'), cv = $('#canvas');
  const sx = c ? c.scrollLeft : 0, sy = cv ? cv.scrollTop : 0;
  const hadFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.cand');
  render();
  if ($('#cards')) $('#cards').scrollLeft = sx; if ($('#canvas')) $('#canvas').scrollTop = sy;
  if (hadFocus) { const el = document.querySelector(`.cand[data-idx="${ui.focus}"]`); el && el.focus({preventScroll:true}); }
}
function closeCtx(){ document.querySelectorAll('.ctx').forEach(m => m.remove()); ui.ctx = null; }
function openCtx(x, y, items){
  closeCtx();
  const m = document.createElement('div'); m.className = 'ctx'; m.setAttribute('role','menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : it.cap ? `<div class="cap">${esc(it.cap)}</div>` : `<button role="menuitem" data-i="${i}">${esc(it.label)}</button>`).join('');
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  m.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (!b) return; const it = items[+b.dataset.i]; closeCtx(); it.run(); });
  m.querySelector('button')?.focus();
  ui.ctx = m;
}
function libCtx(fontId, x, y){
  const f = F[fontId];
  const plates = S.plates.filter(p => !p.deleted).sort((a,b) => b.updated - a.updated).slice(0, 5);
  openCtx(x, y, [
    {label:'Plate mới từ font này   ⇧P', run:() => createPlate(fontId)},
    '-', {cap:'Thêm vào Plate ▸ (vào khay, không đổi trang)'},
    ...plates.map(p => ({label:'   ' + p.name, run:() => {
      const slot = voice(p,2) ? 2 : 1;
      p.pinned[slot] = (p.pinned[slot] || []).filter(z => z.font !== fontId); p.pinned[slot].unshift({font:fontId, lib:true});
      p.updated = Date.now(); persist(); render();
      toast(`Đã ghim ${f.fam} vào khay “${p.name}”`, {label:'Mở', run:() => { S.open = p.id; S.view = 'plate'; p.tab = 'pinned'; p.sel = p.sel || 'body'; render(); }});
    }})),
  ]);
}
function trayCardCtx(i, x, y){
  const p = cur(); const it = ui.list[i]; if (!it) return;
  const slot = activeSlot(p);
  openCtx(x, y, [
    {label:`Đặt cho giọng ${slot}`, run:() => setVoice(p, slot, it.f.id, it.wAdj || 0)},
    {label:'Ghim / bỏ ghim', run:() => togglePin(p, slot, it.f.id)},
    {label:'Tạo giọng mới với font này', run:() => addVoice(p, it.f.id)},
    '-', {label:'Ghi chú…', run:() => { const n = prompt('Ghi chú một dòng cho ' + it.f.fam, ''); if (n == null) return; const arr = p.pinned[slot] = p.pinned[slot] || []; let e = arr.find(z => z.font === it.f.id); if (!e) { e = {font:it.f.id}; arr.unshift(e); } e.note = n; touch(); render(); }},
  ]);
}

/* ---------- click ---------- */
document.addEventListener('click', e => {
  if (ui.ctx && !e.target.closest('.ctx')) closeCtx();
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, p = cur();
  switch(a){
    case 'nav-lib': S.view = 'lib'; S.open = null; render(); break;
    case 'nav-home': S.view = 'home'; S.open = null; render(); break;
    case 'open': S.open = +b.dataset.id; S.view = 'plate'; ui.preview = null; ui.focus = 0; const op = cur(); if (op) { op.updated = op.updated; } render(); break;
    case 'new-plate': if (S.view === 'lib' && S.libSel) createPlate(S.libSel); else { S.view = 'home'; S.open = null; ui.focusSeed = true; render(); } break;
    case 'seed': ui.seedQ = ''; createPlate(b.dataset.font); break;
    case 'seed-layout': S.lastLayout = b.dataset.layout; persist(); render(); break;
    case 'restore': { const q = S.plates.find(x => x.id === +b.dataset.id); q.deleted = false; persist(); render(); break; }
    case 'lib-sel': S.libSel = b.dataset.font; render(); break;
    case 'star': p.starred = !p.starred; touch(true); render(); live(p.starred ? 'Đã đánh sao. Plate hiện ở sidebar.' : 'Đã bỏ sao.'); break;
    case 'layout': p.layout = b.dataset.v; S.lastLayout = p.layout; if (!LAYOUTS[p.layout].roles.includes(p.sel)) p.sel = LAYOUTS[p.layout].roles.find(r => ROLE[r].v === activeSlot(p)) || LAYOUTS[p.layout].roles[0]; ui.preview = null; ui.editing = null; touch(true); render(); break;
    case 'vi': p.projectVi = !p.projectVi; touch(); render(); break;
    case 'xnorm': p.xnorm = !p.xnorm; touch(); render(); break;
    case 'depth': p.depth = +b.dataset.v; touch(); render(); break;
    case 'tray': p.trayOpen = !p.trayOpen; touch(); render(); break;
    case 'tab': p.tab = b.dataset.v; ui.focus = 0; ui.loading = true; render(); setTimeout(() => { ui.loading = false; render(); }, 260); touch(); break;
    case 'mode': p.mode = b.dataset.v; ui.focus = 0; touch(); render(); break;
    case 'style-all': p.style = 'all'; touch(); render(); break;
    case 'price': p.priceStyle = b.dataset.v; touch(); render(); break;
    case 'hl': ui.highlight = !ui.highlight; render(); break;
    case 'sel-role': p.sel = b.dataset.role; ui.focus = 0; ui.preview = null; touch(); render(); break;
    case 'pick-slot': { const r = LAYOUTS[p.layout].roles.find(r => roleSlot(p, r) === +b.dataset.slot); if (r) p.sel = r; p.trayOpen = true; touch(); render(); break; }
    case 'add-voice': addVoice(p); break;
    case 'pin': togglePin(p, activeSlot(p), b.dataset.font); break;
    case 'set': { const x = ui.list[+b.dataset.idx]; if (x) setVoice(p, activeSlot(p), x.f.id, x.wAdj || 0); break; }
    case 'try': { const i = +b.dataset.idx; if (ui.preview && ui.list[i] && ui.preview.font === ui.list[i].f.id) endTry(); else startTry(i); break; }
    case 'voice-menu': {
      const slot = +b.dataset.slot, r = b.getBoundingClientRect();
      const items = [
        {label:'Đổi kiểu (Light · Regular · Bold)…', run:() => { const role = LAYOUTS[p.layout].roles.find(x => roleSlot(p, x) === slot); if (role) p.sel = role; p.tab = 'family'; p.trayOpen = true; render(); }},
        {label:'Tìm font giống', run:() => { const role = LAYOUTS[p.layout].roles.find(x => roleSlot(p, x) === slot); if (role) p.sel = role; p.tab = 'similar'; p.trayOpen = true; render(); }},
      ];
      if (!voice(p, slot).anchor) items.push({label:'Đặt làm neo', run:() => { p.voices.forEach(v => v.anchor = v.slot === slot); touch(); render(); }});
      if (slot > 1) items.push('-', {label:'Bỏ giọng này (vai về giọng còn lại)', run:() => { p.voices = p.voices.filter(v => v.slot !== slot); Object.keys(p.roleVoice).forEach(k => { if (p.roleVoice[k] === slot) delete p.roleVoice[k]; }); touch(true); render(); }});
      openCtx(r.left - 150, r.bottom + 4, items); break;
    }
    case 'plate-menu': {
      const r = b.getBoundingClientRect();
      openCtx(r.left - 170, r.bottom + 4, [
        {label:'Nhân bản (P1)', run:() => { const c = JSON.parse(JSON.stringify(p)); c.id = S.nextId++; c.name = p.name + ' · B'; c.starred = false; c.updated = Date.now(); S.plates.push(c); S.open = c.id; touch(true); render(); toast('Đã nhân bản để so phương án'); }},
        {label:'Xuất PNG / PDF (P1)', run:() => toast('Xuất có chân trang ghi font và cỡ — chưa có trong prototype')},
        {label:'Lịch sử (P1)', run:() => toast('Mốc tự động sau mỗi lần Đặt — chưa có trong prototype')},
        '-', {label:'Xoá (vào “Đã xoá” 30 ngày)', run:() => { p.deleted = true; S.view = 'home'; S.open = null; persist(); render(); toast(`Đã xoá “${p.name}”`, {label:'Hoàn tác', run:() => { p.deleted = false; S.open = p.id; S.view = 'plate'; persist(); render(); }}); }},
      ]); break;
    }
  }
});
/* ---------- chọn vai trên trang / sửa chữ ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('.page .role'); if (!el || el.isContentEditable) return;
  const p = cur(); if (!p) return;
  if (p.sel !== el.dataset.role) { p.sel = el.dataset.role; ui.focus = 0; ui.preview = null; p.trayOpen = true; touch(); render(); document.querySelector(`[data-key="${el.dataset.key}"]`)?.focus({preventScroll:true}); }
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('.page .role'); if (!el) return;
  ui.editing = el.dataset.key; ui.highlight = ui.highlight; render();
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.id === 'pname') { const p = cur(); const v = el.textContent.trim(); if (p && v && v !== p.name) { p.name = v; touch(true); renderSide(); } }
  if (el.classList && el.classList.contains('role') && el.isContentEditable) {
    const p = cur(); const key = el.dataset.key;
    const clone = el.cloneNode(true); clone.querySelector('.role-tag')?.remove();
    let v = clone.textContent.replace(/\s+/g,' ').trim();
    const R = ROLE[keyRole(key)];
    const orig = (p.texts[p.layout] || {})[key] ?? LAYOUTS[p.layout].text[key];
    if (R.up && v === orig.toUpperCase()) v = orig;
    if (v && v !== orig) { p.texts[p.layout] = {...(p.texts[p.layout] || {}), [key]: v}; touch(); }
    ui.editing = null;
    setTimeout(render, 0);
    if (key === 'wordmark' && p.fresh && v) { p.fresh = false; toast(`Đổi tên Plate thành “${v}”?`, {label:'Đổi', run:() => { p.name = v; touch(true); render(); }}); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'seedq') { ui.seedQ = e.target.value; ui.focusSeed = true; renderHome(); }
  if (e.target.id === 'libq') { ui.libQ = e.target.value; const pos = e.target.selectionStart; renderPlate(); const i = $('#libq'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'style') {
    const p = cur(); p.style = e.target.value;
    if (p.style === 'break' && p.mode !== 'experimental') { p.mode = 'experimental'; toast('“Phá cách” cần chế độ Thử nghiệm — đã chuyển.'); }
    ui.focus = 0; touch(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'pname' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  if (e.target.classList?.contains('role') && e.target.isContentEditable && e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
});
/* ---------- thử bằng hover ---------- */
document.addEventListener('pointerover', e => {
  const b = e.target.closest('[data-act="try"]'); if (b) startTry(+b.dataset.idx);
});
document.addEventListener('pointerout', e => {
  const b = e.target.closest('[data-act="try"]'); if (b && !b.contains(e.relatedTarget) && !ui.spaceHeld) endTry();
});
/* ---------- menu ngữ cảnh ---------- */
document.addEventListener('contextmenu', e => {
  const fc = e.target.closest('.fcard'); if (fc) { e.preventDefault(); S.libSel = fc.dataset.font; renderLib(); libCtx(fc.dataset.font, e.clientX, e.clientY); return; }
  const cd = e.target.closest('.cand'); if (cd) { e.preventDefault(); trayCardCtx(+cd.dataset.idx, e.clientX, e.clientY); return; }
  const ro = e.target.closest('.page .role'); if (ro) { e.preventDefault(); const p = cur(); const role = ro.dataset.role;
    openCtx(e.clientX, e.clientY, [
      {label:'Chọn font khác…', run:() => { p.sel = role; p.trayOpen = true; render(); }},
      {label:'Sửa chữ (nhấp đúp)', run:() => { ui.editing = ro.dataset.key; render(); }},
      '-', {cap:'Chuyển sang giọng'}, ...p.voices.filter(v => v.slot !== roleSlot(p, role)).map(v => ({label:`   ${v.slot} · ${F[v.font].fam}`, run:() => { p.roleVoice[role] = v.slot; p.sel = role; touch(true); render(); }})),
      {label:'Tách thành giọng mới', run:() => { p.sel = role; addVoice(p); }},
      '-', {label:'Khôi phục chữ mẫu', run:() => { const t = p.texts[p.layout]; if (t) delete t[ro.dataset.key]; touch(); render(); }},
    ]); }
});
/* ---------- kéo thả ---------- */
let drag = null;
document.addEventListener('dragstart', e => {
  const f = e.target.closest('[data-drag-font]'); const r = e.target.closest('[data-drag-role]');
  if (r) { drag = {role:r.dataset.dragRole}; }
  else if (f) { drag = {font:f.dataset.dragFont, wAdj:+(f.dataset.wadj||0)}; }
  if (drag) { e.dataTransfer.effectAllowed = 'copyMove'; e.dataTransfer.setData('text/plain', JSON.stringify(drag)); }
});
document.addEventListener('dragover', e => {
  if (!drag) return;
  const t = e.target.closest(drag.role ? '[data-drop-slot]' : '[data-drop-slot],[data-drop-role],#start,[data-drop-plate]');
  document.querySelectorAll('.drop').forEach(x => x !== t && x.classList.remove('drop'));
  if (t) { e.preventDefault(); t.classList.add('drop'); }
});
document.addEventListener('drop', e => {
  if (!drag) return; e.preventDefault();
  document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  const p = cur();
  const plateNav = e.target.closest('[data-drop-plate]');
  if (plateNav && drag.font) { const q = S.plates.find(x => x.id === +plateNav.dataset.dropPlate); const slot = voice(q,2) ? 2 : 1; q.pinned[slot] = (q.pinned[slot]||[]).filter(z => z.font !== drag.font); q.pinned[slot].unshift({font:drag.font, lib:true}); persist(); toast(`Đã ghim ${F[drag.font].fam} vào khay “${q.name}”`); drag = null; return; }
  if (e.target.closest('#start') && drag.font) { createPlate(drag.font); drag = null; return; }
  const slotEl = e.target.closest('[data-drop-slot]'), roleEl2 = e.target.closest('[data-drop-role]');
  if (drag.role && slotEl && p) {
    if (slotEl.dataset.dropSlot === 'new') { p.sel = drag.role; addVoice(p); } else { p.roleVoice[drag.role] = +slotEl.dataset.dropSlot; p.sel = drag.role; touch(true); render(); }
  } else if (drag.font && p) {
    if (slotEl) { if (slotEl.dataset.dropSlot === 'new') addVoice(p, drag.font); else setVoice(p, +slotEl.dataset.dropSlot, drag.font, drag.wAdj); }
    else if (roleEl2) { const role = roleEl2.dataset.dropRole, fid = drag.font; p.sel = role; setVoice(p, roleSlot(p, role), fid, drag.wAdj); toast(`Đã đặt ${F[fid].fam} cho cả giọng của “${ROLE[role].n}”`, {label:'Chỉ vai này', run:() => { p.sel = role; addVoice(p, fid); }}); }
  }
  drag = null;
});
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });

/* ---------- bàn phím ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,[contenteditable="true"]');
  if (e.key === 'Escape') {
    if (ui.ctx) { closeCtx(); return; }
    if (ui.preview) { endTry(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); S.view = 'home'; S.open = null; ui.focusSeed = true; render(); return; }
  if (typing) return;
  if (S.view === 'lib' && e.shiftKey && e.key.toLowerCase() === 'p' && S.libSel) { e.preventDefault(); createPlate(S.libSel); return; }
  const p = cur(); if (S.view !== 'plate' || !p) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); p.starred = !p.starred; touch(true); render(); return; }
  if (e.altKey && /^Digit[1-5]$/.test(e.code)) { e.preventDefault(); const k = LAYOUT_KEYS[+e.code.slice(-1)-1]; document.querySelector(`[data-act="layout"][data-v="${k}"]`)?.click(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = ui.list?.length || 0;
  const focusCard = () => { const el = document.querySelector(`.cand[data-idx="${ui.focus}"]`); el?.focus(); el?.scrollIntoView({block:'nearest', inline:'nearest'}); };
  if (e.key === 'ArrowRight' && n) { e.preventDefault(); ui.focus = Math.min(n-1, ui.focus+1); if (ui.preview) ui.preview = null; rerenderKeepScroll(); focusCard(); }
  else if (e.key === 'ArrowLeft' && n) { e.preventDefault(); ui.focus = Math.max(0, ui.focus-1); if (ui.preview) ui.preview = null; rerenderKeepScroll(); focusCard(); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('.page')) {
    e.preventDefault(); const roles = [...document.querySelectorAll('.page:not([aria-hidden]) .role')].filter(el => !el.closest('[aria-hidden]'));
    const i = roles.indexOf(e.target.closest('.role')); const nx = roles[Math.max(0, Math.min(roles.length-1, i + (e.key==='ArrowDown'?1:-1)))];
    if (nx) { p.sel = nx.dataset.role; ui.focus = 0; render(); document.querySelector(`.page [data-key="${nx.dataset.key}"]`)?.focus(); }
  }
  else if (e.key === ' ' && n && !e.repeat && (e.target.closest('.cand') || e.target === document.body)) { e.preventDefault(); ui.spaceHeld = true; startTry(ui.focus); }
  else if (e.key === 'Enter' && e.target.closest('.cand')) { e.preventDefault(); const x = ui.list[ui.focus]; if (x && !x.current) setVoice(p, activeSlot(p), x.f.id, x.wAdj || 0); }
  else if (e.key === 'Enter' && e.target.closest('.page .role')) { e.preventDefault(); ui.editing = e.target.closest('.role').dataset.key; render(); }
  else if (e.key.toLowerCase() === 'g' && n) { const x = ui.list[ui.focus]; if (x) togglePin(p, activeSlot(p), x.f.id); }
  else if (e.key.toLowerCase() === 't') { p.trayOpen = !p.trayOpen; touch(); render(); }
  else if (['1','2','3'].includes(e.key)) { p.depth = +e.key - 1; touch(); render(); }
});
document.addEventListener('keyup', e => { if (e.key === ' ' && ui.spaceHeld) { ui.spaceHeld = false; endTry(); } });
$('#reset').onclick = () => { localStorage.removeItem(KEY); location.reload(); };
// trang dài: cho phép mở trực tiếp ?plate=1 hoặc ?view=lib để chụp màn hình
(() => { const q = new URLSearchParams(location.search);
  if (q.get('fresh') === '1') { S = {plates:seedPlates(), view:'home', open:null, nextId:4, lastLayout:'menu', libSel:null}; }
  if (q.get('empty') === '1') { S = {plates:[], view:'home', open:null, nextId:1, lastLayout:'menu', libSel:null}; }
  if (q.get('plate')) { S.open = +q.get('plate'); S.view = 'plate'; const p = cur(); if (p) { if (q.get('layout')) p.layout = q.get('layout'); if (q.get('depth')) p.depth = +q.get('depth'); if (q.get('tab')) p.tab = q.get('tab'); if (q.get('sel')) p.sel = q.get('sel'); } }
  if (q.get('view') === 'lib') S.view = 'lib';
  if (q.get('seed') && F[q.get('seed')]) { setTimeout(() => createPlate(q.get('seed')), 0); }
})();
render();
</script>
