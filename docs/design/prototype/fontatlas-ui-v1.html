<title>FontAtlas UI v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600&family=Roboto+Slab:wght@400;600&family=JetBrains+Mono:wght@400&family=Dancing+Script:wght@500&family=Oswald:wght@400;500&family=Bricolage+Grotesque:wght@400;600&family=EB+Garamond:ital@0;1&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Josefin+Sans:wght@400;600&family=Alegreya:wght@400&family=DM+Serif+Display&family=Syne:wght@500;700&family=Abril+Fatface&family=Space+Mono&display=swap">
<style>
/* Layout: borderless translucent sidebar on window chrome (Claude / ChatGPT) · raised content sheet with grid + detail panel · floating sample composer at the bottom */
:root {
  /* Existing FontAtlas tokens (UX/index.css) */
  /* macOS sidebar material: in the app the window is transparent and NSVisualEffectView (Tauri windowEffects "sidebar")
     paints this layer. Here a blurred wallpaper + translucent fill stands in for it. */
  --wallpaper: radial-gradient(120% 90% at 10% 0%, #C9B8A6 0%, transparent 55%), radial-gradient(90% 80% at 100% 100%, #8FA3B8 0%, transparent 60%), linear-gradient(160deg, #D8D2CA, #B9C2C9);
  --chrome: rgba(240,238,235,.66);
  --chrome-hover: rgba(41,37,36,.06);
  --chrome-active: rgba(41,37,36,.09);
  --sheet: #FAFAFA;               /* content sheet */
  --fg: #2A2A2A;
  --card: #FFFFFF;
  --border: #E7E5E4;
  --muted: #78716C;
  --surface-2: #F3F2F0;
  --glass: rgba(239,238,236,.82);
  --composer: rgba(255,255,255,.86);
  --accent: #D4A574;
  --accent-ink: #9A6B3C;
  --accent-soft: #F5E6D3;
  --on: #3FA66B;
  --warn: #C2410C;
  --shadow: 0 1px 2px rgba(41,37,36,.06), 0 10px 30px rgba(41,37,36,.10);

  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --text-2xs: 10px; --text-xs: 11px; --text-sm: 12px; --text-base: 13px;
  --radius-sm: 7px; --radius-md: 10px; --radius-lg: 14px;
  --side-w: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wallpaper: radial-gradient(120% 90% at 10% 0%, #4A3B2E 0%, transparent 55%), radial-gradient(90% 80% at 100% 100%, #26364A 0%, transparent 60%), linear-gradient(160deg, #1E1B19, #151A1F);
    --chrome: rgba(28,26,24,.62); --chrome-hover: rgba(250,250,249,.06); --chrome-active: rgba(250,250,249,.10);
    --sheet: #1C1917; --fg: #FAFAF9; --card: #23201E; --border: #2E2A27;
    --muted: #A8A29E; --surface-2: #2A2623;
    --glass: rgba(20,18,16,.86); --composer: rgba(35,32,30,.88);
    --accent: #E0B07E; --accent-ink: #E0B07E; --accent-soft: rgba(224,176,126,.14);
    --on: #4ADE80; --warn: #FB923C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wallpaper: radial-gradient(120% 90% at 10% 0%, #4A3B2E 0%, transparent 55%), radial-gradient(90% 80% at 100% 100%, #26364A 0%, transparent 60%), linear-gradient(160deg, #1E1B19, #151A1F);
  --chrome: rgba(28,26,24,.62); --chrome-hover: rgba(250,250,249,.06); --chrome-active: rgba(250,250,249,.10);
  --sheet: #1C1917; --fg: #FAFAF9; --card: #23201E; --border: #2E2A27;
  --muted: #A8A29E; --surface-2: #2A2623;
  --glass: rgba(20,18,16,.86); --composer: rgba(35,32,30,.88);
  --accent: #E0B07E; --accent-ink: #E0B07E; --accent-soft: rgba(224,176,126,.14);
  --on: #4ADE80; --warn: #FB923C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}

html, body { height: 100%; min-width: 1000px; min-height: 700px; margin: 0; }
body {
  background: var(--wallpaper) fixed; background-color: #C8C2BA; color: var(--fg);
  font-family: var(--font-ui); font-size: var(--text-base);
  -webkit-font-smoothing: antialiased; overflow: auto;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; }
.ico { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Shell ---------- */
.app {
  height: 100%; position: relative;
  display: grid; grid-template-columns: var(--side-w) minmax(0,1fr);
  padding: 8px 8px 8px 0;
  background: var(--chrome);
  -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  transition: grid-template-columns .22s ease;
}
.app.collapsed { grid-template-columns: 56px minmax(0,1fr); }

/* ---------- Sidebar: no card, no border, sits on the translucent chrome ---------- */
.side {
  position: relative; z-index: 30;
  width: var(--side-w); height: 100%;
  display: flex; flex-direction: column; min-height: 0;
  padding: 0 8px;
  background: transparent;
  transition: width .22s ease, background .22s ease, box-shadow .22s ease;
}
/* collapsed = icon rail that stays in the layout; content reflows, nothing overlaps */
.app.collapsed .side { width: 56px; overflow: hidden; }
.side-top { display: flex; align-items: center; gap: 2px; height: 36px; padding-left: 2px; }
.side-top .spacer { flex: 1; }
.iconbtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--chrome-hover); color: var(--fg); }
.iconbtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

.side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-block: 6px 12px; scrollbar-width: none; }
.nav {
  display: flex; align-items: center; gap: 12px; width: 100%;
  height: 34px; padding: 0 9px; border-radius: var(--radius-sm);
  text-align: left; color: var(--fg); white-space: nowrap; font-size: 14px;
}
.nav:hover { background: var(--chrome-hover); }
.nav[aria-current="true"] { background: var(--chrome-active); font-weight: 500; }
.nav .ico { color: var(--fg); opacity: .78; }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav .n { font-size: var(--text-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .kbd { font-size: var(--text-2xs); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
.nav .more { display: none; width: 22px; height: 22px; place-items: center; border-radius: 5px; color: var(--muted); }
.nav .more:hover { background: var(--chrome-active); color: var(--fg); }
.nav:hover .more { display: grid; }
.nav:hover .more ~ .n { display: none; }
.swatch { width: 9px; height: 9px; border-radius: 3px; margin-inline: 4px; flex: none; }
.ejected { color: var(--muted); }
.ejected .lbl { text-decoration: line-through; text-decoration-color: var(--muted); }


/* expandable sections */
.sec { margin-top: 14px; }
.sec-head {
  display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 0 9px;
  border-radius: var(--radius-sm); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.sec-head:hover { color: var(--fg); }
.sec-head .tri { width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; margin-left: 2px; }
.sec[data-open="true"] .tri { transform: rotate(90deg); }
.sec-head .sp { flex: 1; }
.sec-head .add { display: none; width: 22px; height: 22px; place-items: center; border-radius: 5px; }
.sec-head .add:hover { background: var(--chrome-hover); }
.sec:hover .sec-head .add { display: grid; }
.sec-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
.sec[data-open="false"] .sec-body { grid-template-rows: 0fr; }
.sec-body > div { overflow: hidden; display: flex; flex-direction: column; gap: 1px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 9px; }
.tag { height: 24px; padding: 0 9px; border-radius: 99px; background: var(--chrome-hover); font-size: var(--text-sm); color: var(--muted); }
.tag:hover { color: var(--fg); }
.tag[aria-pressed="true"] { background: var(--fg); color: var(--chrome); }

/* footer: model progress + profile, like Claude's account row */
.side-foot { display: flex; flex-direction: column; gap: 2px; padding-block: 6px 2px; }
.model .n { display: inline; }
.model .pz { display: none; width: 22px; height: 22px; place-items: center; border-radius: 5px; color: var(--muted); }
.model:hover .pz { display: grid; }
.ring { width: 17px; height: 17px; }
.ring circle { fill: none; stroke-width: 2.4; }
.ring .bgc { stroke: var(--border); }
.ring .fgc { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .4s; }
.me { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 4px 0 6px; border-radius: var(--radius-sm); white-space: nowrap; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--chrome-active); font-size: 12px; flex: none; }
.me .who { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
.me .who small { color: var(--muted); font-size: 12px; }

/* collapsed rail: hide text unless peeking */
.app.collapsed .side :is(.lbl, .n, .more, .sec, .who, .side-top .spacer, .me .iconbtn, .pz) { display: none; }

/* ---------- Content sheet ---------- */
.sheet {
  position: relative; min-width: 0; min-height: 0;
  background: var(--sheet); border-radius: var(--radius-lg);
  box-shadow: 0 0 0 1px var(--border);
  display: grid; grid-template-columns: minmax(0,1fr) auto; overflow: hidden;
}
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 16px; flex: none; }
.topbar h1 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
.topbar .cnt { color: var(--muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.topbar .sp { flex: 1; }
.topbar .ttl { display: flex; align-items: baseline; gap: 8px; min-width: 0; width: 160px; flex: none; overflow: hidden; }
/* search: always visible at the top of the content, never collapses */
.search {
  flex: 1 1 auto; min-width: 140px; max-width: 560px; margin-inline: auto;
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px;
  border-radius: var(--radius-md); background: var(--surface-2); color: var(--muted);
  border: 1px solid transparent;
}
.search:focus-within { background: var(--card); border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 13px; outline: none; }
.search .kbd { font-size: var(--text-2xs); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }
.search .clear { display: none; width: 18px; height: 18px; place-items: center; border-radius: 50%; }
.search.has .clear { display: grid; }
.search.has .kbd { display: none; }
.search .clear .ico { width: 13px; height: 13px; }
.seg { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--surface-2); }
.seg .iconbtn { width: 28px; height: 26px; }
.vi-toggle { height: 30px; padding: 0 10px; border-radius: var(--radius-md); background: var(--surface-2); font-weight: 600; font-size: var(--text-sm); color: var(--muted); }
.vi-toggle[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }

.grid-wrap { flex: 1; overflow-y: auto; padding: 0 12px 120px 16px; min-height: 0; }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 200px), 1fr)); }
.card {
  position: relative; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 12px 12px 10px; min-height: 132px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.card[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.spec { font-size: var(--spec, 34px); line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.meta { display: flex; align-items: center; gap: 6px; font-size: var(--text-2xs); color: var(--muted); min-width: 0; }
.meta .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { position: absolute; top: 10px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--on); box-shadow: 0 0 0 3px color-mix(in srgb, var(--on) 18%, transparent); }
.vi { font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; }
.vi.ok { color: var(--on); }
.vi.miss { color: var(--warn); }
.star { position: absolute; top: 6px; right: 22px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--muted); opacity: 0; }
.star .ico { width: 15px; height: 15px; }
.card:hover .star, .star.on { opacity: 1; }
.star.on { color: var(--accent); }
.star.on .ico { fill: currentColor; }
.grid.list { grid-template-columns: 1fr; gap: 0; }
.grid.list .card { flex-direction: row-reverse; align-items: center; min-height: 0; border-radius: 0; border-width: 0 0 1px; padding: 10px 40px 10px 8px; background: transparent; }
.grid.list .card[aria-selected="true"] { background: var(--accent-soft); box-shadow: none; }
.grid.list .meta { width: 180px; flex: none; }
.grid.list .spec { flex: 1; -webkit-line-clamp: 1; }
.grid.list .dot { top: 50%; margin-top: -3px; }
.grid.list .star { top: 50%; margin-top: -11px; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }

/* ---------- Floating sample composer ---------- */
.composer {
  position: absolute; z-index: 10; left: 50%; bottom: 16px;
  transform: translateX(-50%); width: min(640px, calc(100% - 32px));
  display: flex; align-items: center; gap: 8px;
  padding: 8px 8px 8px 14px; border-radius: 18px;
  background: var(--composer); backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.composer > .ico { color: var(--muted); }
.composer input[type=text] { flex: 1; min-width: 0; border: 0; background: none; color: var(--fg); font: inherit; font-size: 16px; outline: none; height: 34px; }
.composer .size { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; font-size: var(--text-xs); }
.composer .size .a1 { font-size: 10px; } .composer .size .a2 { font-size: 15px; }
input[type=range] { width: 88px; accent-color: var(--accent); }
.presets { display: flex; gap: 2px; }
.presets button { height: 34px; padding: 0 8px; border-radius: 10px; color: var(--muted); font-size: 13px; }
.presets button:hover { background: var(--surface-2); color: var(--fg); }

/* ---------- Detail panel (inside the sheet, divided by a hairline) ---------- */
.panel { width: 340px; min-height: 0; border-left: 1px solid var(--border); background: var(--sheet); display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
.p-head { padding: 14px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
/* header: name → classification line → styles → name-table card */
.p-sub { font-size: var(--text-xs); color: var(--muted); margin-top: -7px; font-variant-numeric: tabular-nums; }
.p-sec { display: flex; flex-direction: column; gap: 6px; }
.p-label { font-size: var(--text-2xs); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.styles { display: flex; flex-wrap: wrap; gap: 4px; }
.styles button {
  height: 26px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--card); font-size: 13px; color: var(--fg); white-space: nowrap;
}
.styles button:hover { border-color: var(--accent); }
.styles button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--sheet); }
.styles .more { font-family: var(--font-ui) !important; font-weight: 500 !important; font-style: normal !important; color: var(--muted); border-style: dashed; }
.p-meta { margin: 0; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); overflow: hidden; }
.p-meta > div { display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 10px; padding: 7px 10px; align-items: baseline; }
.p-meta > div + div { border-top: 1px solid var(--border); }
.p-meta dt { font-size: var(--text-2xs); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.p-meta dd { margin: 0; min-width: 0; font-size: var(--text-sm); line-height: 1.45; overflow-wrap: anywhere; }
.p-meta dd.soft { color: var(--muted); font-size: var(--text-xs); }
.p-meta dd.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: var(--text-2xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-row { display: flex; align-items: center; gap: 8px; }
.p-name { flex: 1; min-width: 0; font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
select { height: 28px; padding: 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; font-size: var(--text-sm); flex: 1; min-width: 0; }
.chip { height: 22px; padding: 0 8px; border-radius: 99px; background: var(--surface-2); font-size: var(--text-xs); color: var(--muted); display: inline-flex; align-items: center; }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--border); position: relative; transition: background .15s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--on); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; padding: 8px 10px; border-block: 1px solid var(--border); background: var(--sheet); }
.tab { flex: 1; height: 32px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--muted); }
.tab:hover { background: var(--surface-2); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.tab .g { font-family: "Fraunces", Georgia, serif; font-size: 16px; line-height: 1; }
.p-body { flex: none; padding: 14px; display: flex; flex-direction: column; gap: 16px; }
.big { font-size: 64px; line-height: 1.05; overflow-wrap: anywhere; }
.para { font-size: 15px; line-height: 1.55; }
.waterfall { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
.wf-row { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
.wf-row span:first-child { width: 22px; flex: none; font-size: var(--text-2xs); color: var(--muted); font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.wf-row span:last-child { overflow: hidden; text-overflow: ellipsis; }
.stack { font-size: 46px; line-height: 1.6; letter-spacing: .02em; }
.cov { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.num { font-variant-numeric: tabular-nums; font-size: var(--text-sm); color: var(--muted); min-width: 52px; text-align: right; }
.missing { display: flex; flex-wrap: wrap; gap: 4px; }
.missing span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; border: 1px dashed var(--warn); color: var(--warn); font-size: 15px; }
.axes { display: flex; flex-direction: column; gap: 12px; }
.axis { display: grid; grid-template-columns: 18px 1fr 40px; align-items: center; gap: 10px; }
.axis .sym { font-size: 14px; color: var(--accent-ink); text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--text-2xs); color: var(--muted); }
.anatomy { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px 12px 4px; position: relative; overflow: hidden; }
.anatomy .glyph { font-size: 92px; line-height: 1; }
.anatomy .ln { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--accent); }
.anatomy .ln b { position: absolute; right: 6px; top: -14px; font-size: var(--text-2xs); font-weight: 400; color: var(--accent-ink); }
.sim { display: flex; flex-direction: column; gap: 6px; }
.sim button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); text-align: left; }
.sim button:hover { border-color: var(--accent); }
.sim .s { flex: 1; min-width: 0; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Grid ---------- */
function visible() {
  return FONTS.filter(f => {
    if (S.view === 'star' && !f.star) return false;
    if (S.view === 'recent' && !f.recent) return false;
    if (S.view === 'active' && !f.active) return false;
    if (S.view.startsWith('col:') && !f.col.includes(S.view.slice(4))) return false;
    if (S.view.startsWith('src:') && f.src !== S.view.slice(4)) return false;
    if (S.tag && !f.tags.includes(S.tag)) return false;
    if (S.vi && f.vi) return false;
    if (S.q && !f.name.toLowerCase().includes(S.q.toLowerCase())) return false;
    return true;
  }).sort((a, b) => S.view === 'recent' ? a.recent - b.recent : 0);
}

  return (el && el.dataset.label) || 'Tất cả';

  return out.slice(0, f.n);
}
const SRC_PATH = { gf: '~/Library/Application Support/FontAtlas/google', local: '~/Library/Fonts', ext: '/Volumes/VXData/Fonts' };
function meta(f) {
  const slug = f.name.replace(/\s+/g, '');
  const fmt = f.n > 10 ? 'Variable TTF' : f.src === 'local' ? 'OTF' : 'TTF';
  const glyphs = 380 + f.id * 97 + (f.vi ? 0 : 240);
  return {
    by: DESIGNERS[f.name] || '—',
    ver: (1 + (f.id % 4) * 0.1).toFixed(3),
    fmt, glyphs,
    size: Math.round(glyphs * 0.21 + f.n * 14) + ' KB',
    lic: f.src === 'gf' || f.id % 3 ? 'SIL Open Font License 1.1' : 'Thương mại · EULA',
    foundry: FOUNDRY[f.name] || (f.src === 'gf' ? 'Google Fonts' : '—'),
    copy: `© ${2010 + (f.id * 7) % 14} The ${f.name.replace(' Alt', '')} Project Authors`,
    styles: styleList(f),
    path: `${SRC_PATH[f.src]}/${slug}${fmt.startsWith('Variable') ? '[wght]' : '-Regular'}.${fmt === 'OTF' ? 'otf' : 'ttf'}`
  };
}

/* ---------- Panel ---------- */
function renderPanel() {
  const f = byId(S.sel);
  const panel = $('#panel');
  if (!f) { panel.hidden = true; return; }
  panel.hidden = false;
  $('#pName').textContent = f.name;
  $('#pName').style.fontFamily = f.css + ', var(--font-ui)';
  $('#pSwitch').setAttribute('aria-checked', f.active);
  const m = meta(f);
  if (!m.styles.includes(S.style)) S.style = m.styles.includes('Regular') ? 'Regular' : m.styles[0];
  const shown = S.allStyles ? m.styles : m.styles.slice(0, 6);
  const sty = st => { const i = WEIGHTS.findIndex(w => st.startsWith(w)); return `font-family:${f.css},var(--font-ui);font-weight:${i < 0 ? 400 : (i + 1) * 100};font-style:${/Italic/.test(st) ? 'italic' : 'normal'}`; };
  $('#pSub').textContent = `${f.cls} · ${m.fmt} · ${m.glyphs.toLocaleString('vi-VN')} glyph`;
  $('#pStyles').innerHTML = `
    <div class="p-label"><span>Kiểu</span><span>${m.styles.length}</span></div>
    <div class="styles">${shown.map(st => `<button data-style="${st}" aria-pressed="${st === S.style}" style="${sty(st)}">${st}</button>`).join('')}${m.styles.length > shown.length ? `<button class="more" data-allstyles>+${m.styles.length - shown.length}</button>` : ''}</div>`;
  const row = (k, v, cls = '') => `<div><dt>${k}</dt><dd class="${cls}" ${cls === 'mono' ? `title="${v}"` : ''}>${v}</dd></div>`;
  $('#pMeta').innerHTML =
    row('Thiết kế', m.by) + row('Hãng', m.foundry) + row('Phiên bản', m.ver) +
    row('Giấy phép', m.lic) + row('Bản quyền', m.copy, 'soft') + row('Tệp', m.path, 'mono');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
  const wi = WEIGHTS.findIndex(w => S.style.startsWith(w));
  const ff = `font-family:${f.css},serif;font-weight:${wi < 0 ? 400 : (wi + 1) * 100};font-style:${/Italic/.test(S.style) ? 'italic' : 'normal'}`;
  const sample = esc(S.sample || 'Phở bò Hà Nội');
  let html = '';
  if (S.tab === 'spec') {
    html = `
      <div class="big" style="${ff}">${sample}</div>
      <div class="para" style="${ff}">Hà Nội mùa thu, cây cơm nguội vàng, cây bàng lá đỏ, nằm kề bên nhau, phố xưa nhà cổ, mái ngói thâm nâu.</div>
      <div class="waterfall" style="${ff}">
        ${[48, 32, 24, 18, 14, 11].map(s => `<div class="wf-row"><span>${s}</span><span style="font-size:${s}px">Đẹp như Hà Nội</span></div>`).join('')}
      </div>`;
  } else if (S.tab === 'vi') {
    const total = 134, have = total - f.vi, pct = Math.round(have / total * 100);
    html = `
      <div class="stack" style="${ff}">Ắ Ằ Ẳ Ẵ Ặ<br>ấ ầ ẩ ẫ ậ<br>Ơ ơ Ư ư Đ đ</div>
      <div class="cov"><span class="vi ${f.vi ? 'miss' : 'ok'}">${f.vi ? '◌' : '●'}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="num">${have}/${total}</span></div>
      ${f.vi ? `<div class="missing">${VI_MISSING.slice(0, Math.min(14, Math.ceil(f.vi / 9))).map(c => `<span>${c}</span>`).join('')}</div>` : ''}
      <div class="para" style="${ff};font-size:18px">Tiếng Việt có dấu: Quỳnh, Nguyễn, Hưng Yên, Thừa Thiên Huế.</div>`;
  } else if (S.tab === 'anat') {
    const A = [['●', 'Tương phản nét', f.ax.c], ['◐', 'Độ mở', f.ax.a], ['◆', 'Chiều cao x', f.ax.x], ['○', 'Độ rộng', f.ax.w]];
    html = `
      <div class="anatomy" style="${ff}">
        <span class="glyph">Hxg</span>
        <span class="ln" style="top:28px"><b>cap</b></span>
        <span class="ln" style="top:${28 + Math.round(64 * (1 - f.ax.x / 100) * 0.9)}px"><b>x</b></span>
        <span class="ln" style="top:88px"><b>base</b></span>
      </div>
      <div class="axes">${A.map(([s, l, v]) => `<div class="axis" title="${l}"><span class="sym">${s}</span><span class="bar"><i style="width:${v}%"></i></span><span class="num">${v}</span></div>`).join('')}</div>
      <div class="legend">${A.map(([s, l]) => `<span>${s} ${l}</span>`).join('')}</div>`;
  } else if (S.tab === 'sim') {
    const d = (a, b) => Math.abs(a.ax.c - b.ax.c) + Math.abs(a.ax.a - b.ax.a) + Math.abs(a.ax.x - b.ax.x) + Math.abs(a.ax.w - b.ax.w);
    const sims = FONTS.filter(o => o.id !== f.id).map(o => ({ o, s: Math.max(0, 100 - Math.round(d(f, o) / 2.4)) })).sort((a, b) => b.s - a.s).slice(0, 6);
    html = `<div class="sim">${sims.map(({ o, s }) => `<button data-go="${o.id}" title="${o.name}"><span class="s" style="font-family:${o.css},serif">${sample}</span><span class="pct">${s}%</span>${viMark(o)}</button>`).join('')}</div>`;
  } else if (S.tab === 'pair') {
    const ps = (PAIRS[f.cls] || PAIRS.Sans).map(byName).filter(Boolean);
    const why = [['● tương phản', 'lệch'], ['◆ chiều cao x', 'gần'], ['◐ độ mở', 'gần']];
    html = ps.map((p, i) => `
      <div class="pair">
        <h4 style="${ff}">Phở bò Hà Nội</h4>
        <p style="font-family:${p.css},serif">Nước dùng trong, thơm quế hồi, bánh phở mềm. Mở cửa từ 6 giờ sáng ở phố Lý Quốc Sư.</p>
        <div class="why"><span>${p.name}</span><span style="flex:1"></span><b>${why[i][0]}</b><span>${why[i][1]}</span></div>
      </div>`).join('');
  }
  $('#pBody').innerHTML = html;
}

/* ---------- Model progress (sidebar footer) ---------- */
function renderStatus() {
  const pct = Math.round(S.done / S.total * 100);
  $('#stText').textContent = `${S.done.toLocaleString('vi-VN')}/${S.total.toLocaleString('vi-VN')}`;
  const left = Math.max(0, Math.round((S.total - S.done) / 42));
  $('#stEta').textContent = S.done >= S.total ? 'xong' : S.paused ? 'dừng' : `~${left}′`;
  $('#ring').setAttribute('stroke-dashoffset', (47.1 * (1 - pct / 100)).toFixed(1));
  const pb = $('#stPause');
  pb.innerHTML = ico(S.paused ? 'play' : 'pause');
  pb.setAttribute('aria-label', S.paused ? 'Tiếp tục phân tích' : 'Tạm dừng phân tích');
}
setInterval(() => { if (!S.paused && S.done < S.total) { S.done = Math.min(S.total, S.done + 3); renderStatus(); } }, 700);

/* ---------- Events ---------- */
function markRecent(id) { const f = byId(id); if (!f.recent) { FONTS.forEach(x => { if (x.recent) x.recent++; }); f.recent = 1; } }
function renderAll() { renderSide(); renderGrid(); renderPanel(); renderStatus(); }
const app = $('#app');
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#stPause')) { S.paused = !S.paused; renderStatus(); return; }
  const star = t.closest('[data-star]');
  if (star) { const f = byId(+star.dataset.star); f.star = !f.star; renderSide(); renderGrid(); return; }
  const card = t.closest('.card');
  if (card) { S.allStyles = false; S.sel = +card.dataset.id; markRecent(S.sel); renderSide(); renderGrid(); renderPanel(); return; }
  const sec = t.closest('[data-sec]');
  if (sec) { const k = sec.dataset.sec; S.open[k] = !S.open[k]; const box = sec.parentElement; box.dataset.open = S.open[k]; sec.setAttribute('aria-expanded', S.open[k]); return; }
  const nav = t.closest('[data-view]');
  if (nav && !t.closest('.more')) { S.view = nav.dataset.view; renderSide(); renderGrid(); return; }
  const tag = t.closest('[data-tag]');
  if (tag) { S.tag = S.tag === tag.dataset.tag ? null : tag.dataset.tag; renderSide(); renderGrid(); return; }
  const st = t.closest('[data-style]');
  if (st) { S.style = st.dataset.style; renderPanel(); return; }
  if (t.closest('[data-allstyles]')) { S.allStyles = true; renderPanel(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; renderPanel(); return; }
  const go = t.closest('[data-go]');
  if (go) { S.sel = +go.dataset.go; renderGrid(); renderPanel(); return; }
  const pre = t.closest('[data-preset]');
  if (pre) { S.sample = pre.dataset.preset; $('#sampleInput').value = S.sample; renderGrid(); renderPanel(); return; }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#search').focus(); return; }
  if (e.target.id === 'stPause' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); S.paused = !S.paused; renderStatus(); return; }
  const card = e.target.closest && e.target.closest('.card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
});
$('#pSwitch').onclick = () => { const f = byId(S.sel); f.active = !f.active; renderAll(); };
$('#collapse').onclick = () => {
  app.classList.toggle('collapsed');
  const c = app.classList.contains('collapsed');
  $('#collapse').title = c ? 'Mở rộng sidebar' : 'Thu gọn sidebar';
  $('#collapse').setAttribute('aria-label', $('#collapse').title);
  $('#collapse').blur();
};
$('#searchClear').onclick = e => { e.preventDefault(); $('#search').value = ''; S.q = ''; $('#searchBox').classList.remove('has'); renderGrid(); $('#search').focus(); };
$('#viToggle').onclick = () => { S.vi = !S.vi; $('#viToggle').setAttribute('aria-pressed', S.vi); renderGrid(); };
$('#viewGrid').onclick = () => { S.list = false; $('#viewGrid').setAttribute('aria-pressed', true); $('#viewList').setAttribute('aria-pressed', false); renderGrid(); };
$('#viewList').onclick = () => { S.list = true; $('#viewGrid').setAttribute('aria-pressed', false); $('#viewList').setAttribute('aria-pressed', true); renderGrid(); };
$('#sampleInput').oninput = e => { S.sample = e.target.value; renderGrid(); renderPanel(); };
$('#sizeRange').oninput = e => { S.size = +e.target.value; renderGrid(); };
$('#search').oninput = e => { S.q = e.target.value; $('#searchBox').classList.toggle('has', !!S.q); renderGrid(); };
$('#themeBtn').onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};

hydrateIcons();
renderAll();
</script>
