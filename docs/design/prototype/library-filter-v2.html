<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FontAtlas · Library filter v2 (prototype)</title>
<link rel="icon" href="data:,">
<style>
:root{
  --sheet:#FAFAFA;--card:#FFFFFF;--fg:#2A2A2A;--muted:#78716C;--border:#E7E5E4;--surface-2:#F3F2F0;
  --accent:#D4A574;--accent-ink:#9A6B3C;--accent-soft:#F5E6D3;--on:#3FA66B;--warn:#C2410C;
  --chrome-hover:rgba(41,37,36,.06);--chrome-active:rgba(41,37,36,.09);--shadow:0 12px 32px rgb(0 0 0/.12),0 2px 6px rgb(0 0 0/.06);
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --sheet:#1C1917;--card:#23201E;--fg:#FAFAF9;--muted:#A8A29E;--border:#2E2A27;--surface-2:#2A2623;
  --accent:#E0B07E;--accent-ink:#E0B07E;--accent-soft:rgba(224,176,126,.14);--on:#4ADE80;--warn:#FB923C;
  --chrome-hover:rgba(250,250,249,.06);--chrome-active:rgba(250,250,249,.1);--shadow:0 12px 32px rgb(0 0 0/.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 var(--font-ui);background:var(--sheet);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
.side{padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side .it{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px}
.side .it.on{background:var(--chrome-active)}
.side .it .n{margin-left:auto;color:var(--muted);font-size:12px}
.side h4{margin:16px 10px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.side .foot{margin-top:auto;display:flex;gap:4px;padding:0 6px}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--chrome-hover);color:var(--fg)}
.iconbtn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink)}
.main{position:relative;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;height:52px;flex:none}
.ttl{display:flex;align-items:baseline;gap:8px;min-width:96px}
.ttl h1{font-size:15px;font-weight:600;margin:0}
.ttl .cnt{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.searchwrap{flex:1;display:flex;justify-content:center;min-width:0;position:relative}
/* Ô tìm: tóm tắt bộ lọc tối đa 60%, ô nhập tối thiểu 40% */
.search{position:relative;display:flex;align-items:center;gap:6px;width:100%;max-width:640px;height:36px;padding:0 4px 0 10px;background:var(--surface-2);border:1px solid transparent;border-radius:10px}
.search:focus-within{background:var(--card);border-color:var(--border);box-shadow:0 0 0 3px var(--accent-soft)}
.search>.ic{color:var(--muted)}
.sum{display:inline-flex;align-items:center;max-width:calc(60% - 72px);min-width:0;height:26px;border-radius:7px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;flex:none;overflow:hidden}
.sum[hidden]{display:none}
.sum .open{display:flex;align-items:center;gap:0;min-width:0;height:100%;padding:0 4px 0 8px;white-space:nowrap;overflow:hidden}
.sum .seg{padding:0 1px;border-radius:4px}
.sum .seg+.seg::before{content:"·";margin:0 5px;opacity:.55}
.sum .seg[data-sel=true]{background:var(--accent);color:#2A2A2A;padding:0 4px}
.sum .more{margin-left:6px;padding:0 5px;border-radius:9px;background:color-mix(in srgb,var(--accent) 35%,transparent);font-size:11px}
.sum .more[data-sel=true]{background:var(--accent);color:#2A2A2A}
.sum .x{width:22px;height:100%;display:grid;place-items:center;opacity:.7;flex:none}
.sum .x:hover{opacity:1;background:rgb(0 0 0/.06)}
.search input{flex:1 1 auto;min-width:40%;border:0;background:none;outline:none;font:inherit;font-size:13px;color:var(--fg);height:28px}
.search input::placeholder{color:var(--muted)}
.kbd{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;flex:none}
.kbd[hidden],.fbtn .b[hidden]{display:none}
.fbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px;border-radius:7px;color:var(--muted);flex:none}
.fbtn:hover{background:var(--chrome-hover);color:var(--fg)}
.fbtn[aria-expanded=true]{background:var(--accent-soft);color:var(--accent-ink)}
.fbtn .b{min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#2A2A2A;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.seg2{display:flex;gap:2px}
.grid{flex:1;overflow:auto;padding:4px 16px 96px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-content:start}
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:10px;height:156px;display:flex;flex-direction:column;padding:14px 14px 10px;overflow:hidden}
.card:hover{border-color:color-mix(in srgb,var(--fg) 22%,transparent)}
.card .pv{flex:1;display:flex;align-items:center;font-size:36px;white-space:nowrap;overflow:hidden;line-height:1.1}
.card .meta{display:flex;align-items:center;gap:6px;min-width:0;height:22px}
.card .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px}
.fmt{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 5px}
.star{position:absolute;top:8px;right:8px;opacity:0;color:var(--muted)}
.card:hover .star,.star[data-on=true]{opacity:1}
.star[data-on=true]{color:var(--accent)}
.lang{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 5px 0 6px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);flex:none}
.lang:hover{background:var(--chrome-hover)}
.lang[data-s=part],.lang[data-s=near]{color:var(--fg)}
.lang[data-s=none]{opacity:.55}
.lang[data-s=none] .code{text-decoration:line-through;text-decoration-thickness:1px}
.lang .more{font-weight:500}
.ring{width:12px;height:12px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--border);stroke-width:2.2;fill:none}
.ring .fg{stroke-width:2.2;fill:none;stroke-linecap:round}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:80px 0;color:var(--muted)}
.empty .glyph{font:52px/1 Georgia,serif;color:var(--fg);opacity:.75;border-bottom:1.5px solid var(--accent);padding:0 18px 4px}
.empty .sugs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{height:30px;padding:0 12px;border-radius:8px;background:var(--surface-2);font-size:12.5px;font-weight:500}
.btn:hover{background:var(--chrome-active)}
.btn.ghost{background:none;color:var(--accent-ink)}
.btn b{font-weight:600}
.pbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);min-width:480px;font-size:16px;z-index:5}
.pbar span{flex:1}.pbar .m{color:var(--muted);font-size:13px;flex:none}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--sheet);border-radius:9px;padding:8px 8px 8px 14px;display:flex;gap:12px;align-items:center;font-size:12.5px;box-shadow:var(--shadow)}
.toast[hidden]{display:none}
.toast button{color:var(--accent);font-weight:600;padding:2px 6px}
/* Popover chung */
.pop{position:absolute;z-index:40;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.pop[hidden]{display:none!important}
.ac{top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:min(640px,100%);padding:6px;max-height:440px;overflow:auto}
.ac h5{margin:8px 8px 4px;font-size:11px;font-weight:600;color:var(--muted)}
.ac .row{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:7px;cursor:pointer}
.ac .row[aria-selected=true]{background:var(--chrome-active)}
.ac .row .k{font-size:11px;color:var(--muted);min-width:78px}
.ac .row .v{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .row .c{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tok{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);padding:1px 5px;border-radius:4px;white-space:nowrap}
.ac .hint{padding:6px 8px 4px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--border);margin-top:6px;line-height:1.9}
/* Danh sách "Đang lọc" */
.act{top:calc(100% + 6px);left:max(0px,calc((100% - 640px)/2));width:420px;padding:6px 0}
.act .grp-row{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:start;padding:7px 12px;border-bottom:1px solid var(--border)}
.act .grp-row:last-of-type{border-bottom:0}
.act .grp-row[data-sel=true]{background:var(--accent-soft)}
.act .gl{font-size:11.5px;color:var(--muted);padding-top:3px}
.act .vals{display:flex;flex-wrap:wrap;gap:4px}
.act .v{display:inline-flex;align-items:center;height:22px;padding:0 2px 0 8px;border-radius:6px;background:var(--surface-2);font-size:12px}
.act .v button{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.act .v button:hover{background:var(--chrome-active);color:var(--fg)}
.act .ga{display:flex;gap:2px}
.act .ga button{font-size:11.5px;color:var(--accent-ink);padding:3px 6px;border-radius:5px}
.act .ga button:hover{background:var(--chrome-hover)}
.act .foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--border)}
/* Basic */
.basic{top:calc(100% + 6px);right:max(0px,calc((100% - 640px)/2));width:540px;display:flex;flex-direction:column;max-height:calc(100vh - 80px)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex:none}
.ph strong{font-size:13px}
.pb{padding:2px 14px 6px;overflow:auto}
.pf{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex:none}
.pf .sp{flex:1}
.frow{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:0}
.lb{font-size:12px;font-weight:600;padding-top:5px;display:flex;align-items:center;gap:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tile{min-width:62px;padding:0 4px;height:54px;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--card)}
.tile .g{font-size:21px;line-height:1}
.tile .t{font-size:10.5px;color:var(--muted);white-space:nowrap}
.c{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile:hover,.pill:hover{border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.tile[aria-pressed=true],.pill[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.tile[aria-pressed=true] .t,.pill[aria-pressed=true]{color:var(--accent-ink)}
.tile[data-zero=true],.pill[data-zero=true],.steps button[data-zero=true]{opacity:.4}
.pill{height:26px;padding:0 9px;border:1px solid var(--border);border-radius:13px;display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--card);white-space:nowrap}
.steps{display:inline-flex;justify-self:start;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.steps button{height:36px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:5px;border-right:1px solid var(--border);font-size:11.5px;color:var(--muted);white-space:nowrap}
.steps button:last-child{border-right:0}
.steps button .g{font:19px/1 Georgia,serif;color:var(--fg)}
.steps button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink)}
.sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.mini-seg{display:inline-flex;background:var(--surface-2);border-radius:7px;padding:2px}
.mini-seg button{height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mini-seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.1)}
.combo{position:relative}
.combo input{height:26px;width:140px;border:1px dashed var(--border);border-radius:13px;padding:0 10px;background:none;color:var(--fg);font:inherit;font-size:12px}
.combo .list{position:absolute;top:30px;left:0;width:250px;max-height:230px;overflow:auto;padding:4px;z-index:3}
.combo .list .row{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px}
.combo .list .row:hover{background:var(--chrome-hover)}
.combo .list small{color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent-ink);margin:0}
/* Advanced: masonry nhiều cột hẹp */
.adv{left:12px;right:12px;top:56px;display:flex;flex-direction:column;max-height:calc(100vh - 72px)}
.adv .pb{padding:10px 12px 10px}
.cards{columns:208px;column-gap:10px}
.fc{break-inside:avoid;margin:0 0 10px;border:1px solid var(--border);border-radius:9px;padding:7px 10px 4px;background:color-mix(in srgb,var(--surface-2) 45%,var(--card))}
.fc>h3{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:11.5px;font-weight:600;height:20px}
.fc>h3 .ic{width:14px;height:14px;color:var(--accent-ink)}
.fc>h3 .n{margin-left:auto;font-weight:500;color:var(--accent-ink);font-size:10.5px}
.fc .opts{gap:4px;padding:2px 0 6px}
.fc .tile{min-width:56px;height:44px}.fc .tile .g{font-size:16px}.fc .tile .t{font-size:10px}
.fc .pill{height:24px;padding:0 8px;font-size:11.5px}
.fc .steps{display:flex}.fc .steps button{flex:1;height:30px;padding:0 4px;font-size:10.5px}.fc .steps button .g{font-size:15px}
.fc .combo input{width:120px;height:24px}
.ax{padding:4px 0 5px;border-top:1px solid var(--border)}
.fc>h3+.ax{border-top:0}
.ax .hd{display:flex;align-items:center;gap:4px;height:18px}
.ax .name{font-size:11.5px;color:var(--muted);cursor:help;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;border-bottom:1px dotted color-mix(in srgb,var(--muted) 45%,transparent)}
.ax[data-on=true] .name{color:var(--fg);font-weight:600}
.ax .vt{font-size:9.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);border-radius:4px;padding:0 3px;color:var(--muted);flex:none}
.ax .vt[aria-pressed=true]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.ax .val{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;align-items:center;white-space:nowrap;flex:none}
.ax[data-on=true] .val{color:var(--fg)}
.ax .u{color:var(--muted);margin-left:3px}
.ax .num{padding:0 2px;border-radius:3px;cursor:text}
.ax .num:hover{background:var(--chrome-hover)}
.ax .num-in{width:44px;height:18px;font:inherit;font-size:11px;text-align:right;border:1px solid var(--accent);border-radius:4px;background:var(--card);color:var(--fg);padding:0 3px}
.ax .num-in[aria-invalid=true]{border-color:var(--warn)}
.ax .rst{width:16px;height:16px;display:grid;place-items:center;border-radius:4px;color:var(--muted);display:none}
.ax[data-on=true] .rst{display:grid}
.ax .rst:hover{background:var(--chrome-hover);color:var(--fg)}
.rng{position:relative;height:22px;touch-action:none;cursor:pointer}
.hist{position:absolute;left:7px;right:7px;bottom:9px;height:11px;display:flex;align-items:flex-end;gap:1px;pointer-events:none}
.hist i{flex:1;background:color-mix(in srgb,var(--muted) 18%,transparent);border-radius:1px 1px 0 0;position:relative}
.hist i b{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--muted) 40%,transparent);border-radius:1px 1px 0 0}
.hist i[data-in=true] b{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.adv[data-hist=false] .hist{visibility:hidden}
.rng .tr{position:absolute;left:7px;right:7px;bottom:6px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--muted) 30%,transparent)}
.rng .sel{position:absolute;bottom:6px;height:3px;border-radius:2px;background:transparent;cursor:grab}
.ax[data-on=true] .rng .sel{background:var(--accent)}
.rng .tick{position:absolute;bottom:2px;width:1px;height:3px;background:color-mix(in srgb,var(--muted) 50%,transparent)}
.rng .th{position:absolute;bottom:1px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--card);border:1.5px solid color-mix(in srgb,var(--muted) 70%,transparent);box-shadow:0 1px 2px rgb(0 0 0/.15)}
.ax[data-on=true] .rng .th{border-color:var(--accent-ink)}
.ax .const{font-size:11px;color:var(--muted);padding:2px 0}
/* Tooltip */
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--fg);color:var(--sheet);border-radius:8px;padding:6px 9px;font-size:12px;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;white-space:pre-line}
.tip[data-show=true]{opacity:1}
.tip.rich{background:var(--card);color:var(--fg);border:1px solid var(--border);padding:10px;width:240px;white-space:normal}
.tip.rich svg{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:6px;margin-bottom:8px}
.tip.rich b{display:block;font-size:12px;margin-bottom:2px}
.tip.rich p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.45}
.tip.rich .ev{margin-top:6px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px}
.tip .miss{font-family:Georgia,serif;letter-spacing:.12em;margin-top:4px;font-size:13px}
.demo{position:fixed;right:10px;bottom:10px;z-index:200;display:flex;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px;font-size:11px;box-shadow:var(--shadow)}
.demo button{padding:3px 6px;border-radius:5px;color:var(--muted)}
.demo button:hover{background:var(--chrome-hover);color:var(--fg)}
@media (max-width:1180px){ .app{grid-template-columns:200px 1fr} .ttl{min-width:0} .pbar{min-width:380px} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>

const NUMKEYS=Object.keys(AX);
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const BASE={sans:{serif_foot:1.05,contrast:.82,stress_deg:0,width_cv:.18},serif:{serif_foot:1.95,contrast:.38,stress_deg:-12,width_cv:.2},slab:{serif_foot:2.2,contrast:.85,stress_deg:0,width_cv:.17},script:{serif_foot:1.3,contrast:.45,stress_deg:-20,width_cv:.26},decorative:{serif_foot:1.4,contrast:.7,stress_deg:0,width_cv:.15}};
const WDTH2CLS=p=>[50,62.5,75,87.5,100,112.5,125,150,200].reduce((b,v,i,a)=>Math.abs(v-p)<Math.abs(a[b]-p)?i:b,0)+1;
const FONTS=RAW.map((r,i)=>{
  const [name,stack,cls,conf,mono,weight,widthc,italic,vax,src,lic,viMissing,miss]=r;
  const [fam,w,st]=stack.split(';'); const b=BASE[cls]; const wf=(weight-100)/800;
  const v={weight,widthc,
    x_height_em:.46+rnd()*.1,x_height_cap:.66+rnd()*.1,ascender_em:.72+rnd()*.12,
    stem:.08+wf*.22+rnd()*.02,darkness:.1+wf*.25+rnd()*.03,contrast:Math.min(1,b.contrast+rnd()*.12-(weight>800?.15:0)),
    stress_deg:b.stress_deg+rnd()*4-2,aperture:.2+rnd()*.25,aperture_e:.15+rnd()*.2,counter:.3+rnd()*.2-wf*.1,
    width:.75+(widthc-5)*.12+rnd()*.12,mean_advance:.95+(widthc-5)*.12+rnd()*.15,width_cv:mono?0:b.width_cv+rnd()*.05,
    spacing:.08+rnd()*.06,serif_foot:b.serif_foot+rnd()*.2,slant_deg:italic?(10+rnd()*6):rnd()*.6};
  const vr=vax?{weight:vax.wght||null,widthc:vax.wdth?vax.wdth.map(WDTH2CLS):null}:{};
  const cov={vie:viMissing,...Object.fromEntries(LANGS.filter(l=>l.id!=='vie').map(l=>[l.id,miss[l.id]??0]))};
  return {id:i,name,fam,w:w||'400',st:st||'normal',cls,conf,mono:!!mono,italic:!!italic,variable:!!vax,vr,src,lic,cov,fav:i%5===1,v,fmt:i%4===1?'OTF':'TTF'};
});
const DOM=Object.fromEntries(NUMKEYS.map(k=>{const vals=FONTS.map(f=>f.v[k]).sort((a,b)=>a-b);const fixed=AX[k].dom;return [k,{min:fixed?fixed[0]:vals[0],max:fixed?fixed[1]:vals.at(-1),t1:vals[Math.floor(vals.length/3)],t2:vals[Math.floor(2*vals.length/3)]}];}));
// Nấc Basic = lối tắt vào cùng range của Advanced (một nguồn sự thật).
const LEVELS={
  weight:[{id:'Light',r:[100,300],g:'a',st:'font-weight:200'},{id:'Regular',r:[400,500],g:'a',st:'font-weight:400'},{id:'Bold',r:[600,900],g:'a',st:'font-weight:800'}],
  widthc:[{id:'Condensed',r:[1,4],g:'o',st:'display:inline-block;transform:scaleX(.7)'},{id:'Normal',r:[5,5],g:'o',st:''},{id:'Expanded',r:[6,9],g:'o',st:'display:inline-block;transform:scaleX(1.3)'}],
  x_height_em:[{id:'Low',r:()=>[DOM.x_height_em.min,DOM.x_height_em.t1],g:'x',st:'font-size:13px'},{id:'Mid',r:()=>[DOM.x_height_em.t1,DOM.x_height_em.t2],g:'x',st:'font-size:17px'},{id:'High',r:()=>[DOM.x_height_em.t2,DOM.x_height_em.max],g:'x',st:'font-size:21px'}],
  contrast:[{id:'Low',r:()=>[DOM.contrast.t2,DOM.contrast.max],g:'o',st:'font-family:Menlo,monospace'},{id:'Mid',r:()=>[DOM.contrast.t1,DOM.contrast.t2],g:'o',st:'font-family:Georgia,serif'},{id:'High',r:()=>[DOM.contrast.min,DOM.contrast.t1],g:'o',st:'font-family:Didot,serif'}],
};
const lvR=o=>typeof o.r==='function'?o.r():o.r;
const LIC={ofl:'OFL',apache:'Apache',other:{vi:'Khác',en:'Other'},unknown:{vi:'Không rõ',en:'Unknown'}};

// ================= Trạng thái =================
const fresh=()=>({text:'',langs:[],langMode:'full',classes:new Set(),lowConf:false,variable:false,italic:null,fav:false,sources:new Set(),lic:new Set(),r:{},vt:{weight:true,widthc:true}});
let S=fresh();
const clone=s=>({...s,langs:[...s.langs],classes:new Set(s.classes),sources:new Set(s.sources),lic:new Set(s.lic),r:{...s.r},vt:{...s.vt}});

let undo=[];
const PREF='vie';
const fold=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();

function matches(f,skip){
  if(S.text&&!fold(f.name).includes(fold(S.text))) return false;
  if(skip!=='langs'&&S.langs.some(id=>!langOk(f,id))) return false;
  if(skip!=='classes'&&!clsOk(f)) return false;
  if(skip!=='style'&&S.variable&&!f.variable) return false;
  if(skip!=='style'&&S.italic!=null&&f.italic!==S.italic) return false;
  if(skip!=='lib'&&S.fav&&!f.fav) return false;
  if(skip!=='lib'&&S.sources.size&&!S.sources.has(f.src)) return false;
  if(skip!=='lic'&&S.lic.size&&!S.lic.has(f.lic)) return false;
  for(const [k,r] of Object.entries(S.r)) if(skip!=='r:'+k&&!numOk(f,k,r)) return false;
  return true;
}
const results=()=>FONTS.filter(f=>matches(f));
const countWith=(skip,test)=>FONTS.filter(f=>matches(f,skip)&&test(f)).length;

// ================= Nhóm điều kiện (dùng cho tóm tắt, danh sách, Backspace) =================
function rangeLabel(k){const [a,b]=S.r[k]; const lv=LEVELS[k]; if(lv){const hit=lv.filter(o=>{const [x,y]=lvR(o);return x>=a-1e-9&&y<=b+1e-9;}); const lo=lvR(hit[0]||{r:[NaN]})[0], hi=hit.length?lvR(hit.at(-1))[1]:NaN;
  if(hit.length&&Math.abs(lo-a)<1e-9&&Math.abs(hi-b)<1e-9) return (k==='weight'||k==='widthc'?'':AX[k].s+' ')+(hit.length>1?hit[0].id+'–'+hit.at(-1).id:hit[0].id);}
  return `${AX[k].s} ${fmt(a,k)}–${fmt(b,k)}${AX[k].u==='em'?' em':AX[k].u==='°'?'°':''}`;}
function groups(){
  const g=[];
  if(S.classes.size) g.push({id:'classes',name:t('g.class'),vals:[...S.classes].map(id=>({t:CLASSES.find(c=>c.id===id).t,rm:()=>S.classes.delete(id)})),seg:v=>v.length>1?`${v[0].t} +${v.length-1}`:v[0].t,clear:()=>S.classes.clear(),edit:'basic'});
  if(S.langs.length) g.push({id:'langs',name:t('g.lang'),vals:S.langs.map(id=>({t:langName(L[id])+(S.langMode==='near'?' ≥90%':''),rm:()=>{S.langs=S.langs.filter(x=>x!==id)}})),seg:v=>v.length>1?t('sum.langs',{n:v.length}):v[0].t,clear:()=>{S.langs=[]},edit:'basic'});
  for(const k of ['weight','widthc']) if(S.r[k]) g.push({id:'r:'+k,name:AX[k].s,vals:[{t:rangeLabel(k),rm:()=>delete S.r[k]}],seg:v=>v[0].t,clear:()=>delete S.r[k],edit:'basic'});
  const sty=[]; if(S.variable) sty.push({t:'Variable',rm:()=>S.variable=false}); if(S.italic!=null) sty.push({t:S.italic?'Italic':'Upright',rm:()=>S.italic=null});

const nConds=()=>groups().reduce((n,g)=>n+g.vals.length,0);
function act(fn,label){ undo.push(clone(S)); if(undo.length>20) undo.shift(); fn(); render(); if(label) toast(t('toast.removed',{g:label})); }

// ================= Thẻ font =================
function badge(f){

  const tip=shown.map(id=>`${langName(L[id])} · ${(f.cov[id]??0)===0?t('badge.full'):t('badge.miss',{m:f.cov[id],t:L[id].total})}`).join('\n');
  const sample=miss&&l.id==='vie'?'Ơ ơ Ư ư Ả ả Ấ ấ Ầ ầ Ẩ ẩ':'';
  return `<button class="lang" data-s="${s}" aria-label="${esc(tip)}" data-langtip="${esc(tip)}" data-miss="${esc(sample)}"><span class="code">${l.code}</span><svg class="ring" viewBox="0 0 12 12"><circle class="bg" cx="6" cy="6" r="4.5"/>${dash>0?`<circle class="fg" cx="6" cy="6" r="4.5" stroke="${col}" stroke-dasharray="${dash.toFixed(2)} ${C.toFixed(2)}"/>`:''}</svg>${shown.length>1?`<span class="more">+${shown.length-1}</span>`:''}</button>`;
}

// ================= Render =================
const $=s=>document.querySelector(s);
function renderStatic(){ document.documentElement.lang=LOC; document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i)); $('#locbtn').textContent=LOC==='vi'?'UI: EN':'UI: VI'; }
function renderGrid(){

  const gs=groups(); const sugs=gs.map((g,i)=>{const keep=clone(S);g.clear();const n=results().length;S=keep;return {g,i,n};}).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,3);
  $('#grid').innerHTML=`<div class="empty" role="status"><div class="glyph">ở</div><div>${t('none.title',{n:nConds()})}</div><div class="sugs">${sugs.map(x=>`<button class="btn" data-loosen="${x.i}">${t('none.drop')} <b>${esc(x.g.vals.map(v=>v.t).join(', '))}</b> → ${t('f.fonts',{n:x.n})}</button>`).join('')}<button class="btn ghost" data-clear>${t('none.clear')}</button></div></div>`;
}
// Tóm tắt trong ô tìm: mỗi nhóm một đoạn; đoạn không vừa 60% bề rộng ô → gộp "+N".
function renderSummary(){
  const gs=groups(); const el=$('#sum'); el.hidden=!gs.length; const n=nConds();
  $('#fcount').hidden=!n; $('#fcount').textContent=n; $('#q').placeholder=n?t('q.more'):t('q.ph'); $('#kbd').hidden=n>0||!!$('#q').value;

  const build=k=>`<button class="open" data-act aria-label="${esc(tipAll)}" data-tip="${esc(tipAll)}">${gs.slice(0,k).map((g,i)=>`<span class="seg" data-sel="${ui.selGroup===i}">${esc(g.seg(g.vals))}</span>`).join('')}${gs.length>k?`<span class="more" data-sel="${ui.selGroup>=k}">${t('sum.more',{n:gs.length-k})}</span>`:''}</button><button class="x" data-clearall aria-label="${t('sum.clear')}" data-tip="${t('sum.clear')}"><svg class="ic" style="width:12px;height:12px"><use href="#i-x"/></svg></button>`;

}
function renderAct(){
  const el=$('#act'); el.hidden=!ui.act; if(!ui.act) return; const gs=groups();
  if(!gs.length){ui.act=false;el.hidden=true;return;}
  el.innerHTML=`<div class="ph" style="padding:6px 12px 8px"><strong>${t('act.title')}</strong><span class="c">${t('f.fonts',{n:results().length})}</span></div>`+gs.map((g,i)=>`<div class="grp-row" data-sel="${ui.selGroup===i}"><span class="gl">${esc(g.name)}</span><span class="vals">${g.vals.map((v,j)=>`<span class="v">${esc(v.t)}<button data-rmv="${i}:${j}" aria-label="${t('act.rm')} ${esc(v.t)}"><svg class="ic" style="width:11px;height:11px"><use href="#i-x"/></svg></button></span>`).join('')}</span><span class="ga"><button data-edit="${g.edit}">${t('act.edit')}</button><button data-rmg="${i}">${t('act.rm')}</button></span></div>`).join('')+`<div class="foot"><span>${t('act.hint')}</span><button class="btn ghost" data-clearall>${t('act.clearall')}</button></div>`;
}
const tile=c=>{const n=countWith('classes',f=>(S.lowConf||f.conf!=='low')&&(c.id==='mono'?f.mono:f.cls===c.id));return `<button class="tile" aria-pressed="${S.classes.has(c.id)}" data-zero="${n===0}" data-cls="${c.id}" data-tip="${esc(c.t+' — '+RULE[LOC][c.id])}"><span class="g" style="font-family:${c.f}">Ag</span><span class="t">${c.t} <span class="c">${n}</span></span></button>`;};
function levelOn(k,o){const r=S.r[k];if(!r)return false;const [x,y]=lvR(o);return x>=r[0]-1e-9&&y<=r[1]+1e-9;}
const steps=k=>`<div class="steps" role="group" aria-label="${AX[k].s}">${LEVELS[k].map(o=>{const n=countWith('r:'+k,f=>numOk(f,k,lvR(o)));return `<button aria-pressed="${levelOn(k,o)}" data-zero="${n===0}" data-lv="${k}:${o.id}"><span class="g" style="${k==='weight'||k==='widthc'?"font-family:'Helvetica Neue',sans-serif;":''}${o.st}">${o.g}</span>${o.id} <span class="c">${n}</span></button>`;}).join('')}</div>`;
const pill=(on,attr,txt,n)=>`<button class="pill" aria-pressed="${on}" data-zero="${n===0}" ${attr}>${txt}${n!=null?` <span class="c">${n}</span>`:''}</button>`;
function langBlock(){
  const quick=['vie','eng','fra']; const extra=S.langs.filter(id=>!quick.includes(id)); const q=fold(ui.langQ);
  const list=LANGS.filter(l=>!q||fold(langName(l)+' '+l.auto+' '+l.en+' '+l.id+' '+l.bcp).includes(q));
  const groupsHtml=['Latin','Cyrillic','Greek'].map(sc=>{const ls=list.filter(l=>l.script===sc);return ls.length?`<div class="c" style="padding:6px 8px 2px">${sc}</div>`+ls.map(l=>`<div class="row" data-lang="${l.id}"><span>${esc(langName(l))} <small>${esc(l.auto)}</small></span><small>${countWith('langs',f=>langOk(f,l.id))}</small></div>`).join(''):'';}).join('');
  return `<div class="opts">${[...quick,...extra].map(id=>pill(S.langs.includes(id),`data-lang="${id}" data-tip="${esc(L[id].auto)}"`,esc(langName(L[id])),countWith('langs',f=>langOk(f,id)))).join('')}<div class="combo"><input id="langq" placeholder="${t('lang.add')}" value="${esc(ui.langQ)}" aria-label="${t('lang.add')}">${ui.langOpen?`<div class="pop list" role="listbox">${groupsHtml||`<div class="row"><small>${t('lang.none')}</small></div>`}</div>`:''}</div></div>
  <div class="sub">${t('lang.cov')} <span class="mini-seg"><button aria-pressed="${S.langMode==='full'}" data-lmode="full">${t('lang.full')}</button><button aria-pressed="${S.langMode==='near'}" data-lmode="near">${t('lang.near')}</button></span></div>`;
}
const lowChk=()=>`<label class="chk"><input type="checkbox" data-low ${S.lowConf?'checked':''}>${t('cls.low')}</label>`;
const styleOpts=()=>pill(S.variable,'data-var','Variable',countWith('style',f=>f.variable))+pill(S.italic===true,'data-it="1"','Italic',countWith('style',f=>f.italic))+pill(S.italic===false,'data-it="0"','Upright',countWith('style',f=>!f.italic));
const libOpts=()=>pill(S.fav,'data-favf',t('fav'),countWith('lib',f=>f.fav))+SOURCES.map(s=>pill(S.sources.has(s),`data-src="${s}"`,s==='System'?t('src.system'):s,countWith('lib',f=>f.src===s))).join('');
const licOpts=()=>Object.keys(LIC).map(k=>pill(S.lic.has(k),`data-lic="${k}"`,licName(k),countWith('lic',f=>f.lic===k))).join('');
function renderBasic(){

function applyTokens(raw){

    if(m&&['class','loai'].includes(m[1])){const c=CLASSES.find(y=>y.id===m[2]||fold(y.t)===m[2]);if(c){S.classes.add(c.id);continue;}}
    if(m&&['weight','wght'].includes(m[1])){const o=LEVELS.weight.find(y=>fold(y.id)===m[2]);if(o){S.r.weight=[...o.r];continue;}const r=/^(\d+)-(\d+)$/.exec(m[2]);if(r){S.r.weight=[+r[1],+r[2]];continue;}}
    if(m){const k=NUMKEYS.find(y=>fold(AX[y].s).replace(/\W/g,'')===m[1]||y===m[1]||y.startsWith(m[1]+'_')||(m[1]==='x'&&y==='x_height_em'));const r=/^([\d.,]+)-([\d.,]+)$/.exec(m[2]);if(k&&r){S.r[k]=[+r[1].replace(',','.'),+r[2].replace(',','.')];continue;}}

function live(){const {k,d,cur}=drag,row=document.querySelector(`.ax[data-ax="${k}"]`),pos=v=>(v-d.min)/(d.max-d.min);
  row.dataset.on='true';const sel=row.querySelector('.sel');sel.style.left=`calc(7px + (100% - 14px)*${pos(cur[0])})`;sel.style.width=`calc((100% - 14px)*${pos(cur[1])-pos(cur[0])})`;
  row.querySelectorAll('.th').forEach((th,i)=>{th.style.left=`calc(7px + (100% - 14px)*${pos(cur[i])})`;th.setAttribute('aria-valuetext',fmt(cur[i],k));});
  row.querySelectorAll('.num').forEach((n,i)=>n.textContent=fmt(cur[i],k));
  const keep=S.r[k];S.r[k]=cur;const n=results().length;if(keep)S.r[k]=keep;else delete S.r[k];const c=$('#advcount');if(c)c.textContent=t('f.match',{n});}
document.addEventListener('dblclick',e=>{const rng=e.target.closest('.rng');if(rng)act(()=>delete S.r[rng.dataset.rng]);});
function editNum(span){
  const k=span.closest('.ax').dataset.ax,i=+span.dataset.num,d=DOM[k];const inp=document.createElement('input');inp.className='num-in';inp.value=span.textContent;inp.setAttribute('aria-label',`${AX[k].l} ${i?'max':'min'}`);
  span.replaceWith(inp);inp.focus();inp.select();let done=false;
  const commit=()=>{if(done)return true;const v=+inp.value.replace(',','.');const c=S.r[k]?[...S.r[k]]:[d.min,d.max];c[i]=v;
    if(!Number.isFinite(v)||c[0]>c[1]){inp.setAttribute('aria-invalid','true');showTip(inp,t('err.num'));return false;}done=true;hideTip();act(()=>{S.r[k]=c;});return true;};
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();commit();}if(e.key==='Escape'){done=true;hideTip();render();}});
  inp.addEventListener('blur',()=>{if(!done)commit();});
}

// ================= Sự kiện =================
const q=$('#q');
q.addEventListener('focus',()=>{ui.ac=true;ui.acIndex=0;ui.basic=false;ui.act=false;render();});
q.addEventListener('input',()=>{ui.ac=true;ui.acIndex=0;ui.selGroup=-1;renderAc();renderSummary();});
q.addEventListener('keydown',e=>{
  const items=ui.items||[];
  if(e.key==='ArrowDown'){e.preventDefault();ui.ac=true;ui.acIndex=Math.min(items.length-1,ui.acIndex+1);renderAc();}
  else if(e.key==='ArrowUp'){e.preventDefault();ui.acIndex=Math.max(0,ui.acIndex-1);renderAc();}
  else if(e.key==='Enter'||(e.key==='Tab'&&q.value&&items.length)){
    e.preventDefault(); const typedTokens=/\S+:\S+/.test(q.value)||q.value.trim().includes(' ');
    act(()=>{ if(!typedTokens&&items[ui.acIndex]&&(q.value.trim()||e.key==='Enter')) items[ui.acIndex].ap(); else applyTokens(q.value); }); q.value=''; ui.ac=false; render();
  }
  else if(e.key==='Backspace'&&!q.value){ // ⌫ lần 1: chọn nhóm cuối; lần 2: bỏ cả nhóm (có hoàn tác)
    const gs=groups(); if(!gs.length) return; e.preventDefault();
    if(ui.selGroup===gs.length-1){const g=gs[ui.selGroup];ui.selGroup=-1;act(()=>g.clear(),g.name);} else {ui.selGroup=gs.length-1;renderSummary();renderAct();}
  }
  else if(e.key==='Backspace'&&(e.metaKey||e.ctrlKey)){e.preventDefault();act(()=>{S=Object.assign(fresh(),{text:''});q.value='';},t('sum.clear'));}
  else if(e.key==='Escape'){ui.ac=false;ui.selGroup=-1;renderAc();renderSummary();q.blur();}
  else ui.selGroup=-1;
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&(document.activeElement!==q||!q.value)){ if(undo.length){e.preventDefault();S=undo.pop();$('#toast').hidden=true;render();} }
  if((e.metaKey||e.ctrlKey)&&e.altKey&&e.code==='KeyF'){e.preventDefault();ui.adv=!ui.adv;ui.basic=false;render();}
  if(e.key==='Escape'&&document.activeElement!==q){if(ui.act)ui.act=false;else if(ui.adv){ui.adv=false;ui.basic=true;}else if(ui.basic){ui.basic=false;$('#fbtn').focus();}render();}
  const th=e.target.closest&&e.target.closest('.th');
  if(th&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const k=th.closest('.rng').dataset.rng,d=DOM[k],i=+th.dataset.th,c=S.r[k]?[...S.r[k]]:[d.min,d.max];
    const step=AX[k].step||(d.max-d.min)/100;c[i]=e.key==='Home'?d.min:e.key==='End'?d.max:snap(k,c[i]+(e.key==='ArrowRight'?1:-1)*step*(e.shiftKey&&!AX[k].step?10:1));if(c[0]>c[1])c[i]=c[1-i];
    act(()=>{S.r[k]=c;});document.querySelector(`.rng[data-rng="${k}"] .th[data-th="${i}"]`)?.focus();}
  const num=e.target.closest&&e.target.closest('.num');if(num&&(e.key==='Enter'||e.key===' ')){e.preventDefault();editNum(num);}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-low]'))act(()=>S.lowConf=e.target.checked);});
document.addEventListener('click',e=>{
  const el=e.target; const c=s=>el.closest(s);
  if(c('.num')){editNum(c('.num'));return;}
  if(c('[data-undo]')){if(undo.length){S=undo.pop();$('#toast').hidden=true;render();}return;}
  if(c('#fbtn')){if(ui.adv)ui.adv=false;else ui.basic=!ui.basic;ui.ac=false;ui.act=false;render();return;}
  if(c('[data-act]')){ui.act=!ui.act;ui.ac=false;ui.basic=false;render();return;}
  if(c('[data-clearall]')){act(()=>{const keep=S.text;S=fresh();S.text=keep;},t('sum.clear'));ui.act=false;render();return;}
  const rv=c('[data-rmv]');if(rv){const [i,j]=rv.dataset.rmv.split(':').map(Number);const g=groups()[i];act(()=>g.vals[j].rm(),g.vals[j].t);return;}
  const rg=c('[data-rmg]');if(rg){const g=groups()[+rg.dataset.rmg];act(()=>g.clear(),g.name);return;}
  const ed=c('[data-edit]');if(ed){ui.act=false;if(ed.dataset.edit==='adv')ui.adv=true;else ui.basic=true;render();return;}
  if(c('[data-close]')){ui.basic=false;ui.adv=false;render();return;}
  if(c('[data-adv]')){ui.adv=true;ui.basic=false;render();return;}
  if(c('[data-shrink]')){ui.adv=false;ui.basic=true;render();return;}
  if(c('[data-histbtn]')){const a=$('#adv');a.dataset.hist=a.dataset.hist==='true'?'false':'true';renderAdv();return;}
  if(c('[data-clear]')){act(()=>{const keep=S.text;S=fresh();S.text=keep;});return;}
  const lo=c('[data-loosen]');if(lo){const g=groups()[+lo.dataset.loosen];act(()=>g.clear(),g.name);return;}
  const cl=c('[data-cls]');if(cl){const id=cl.dataset.cls;act(()=>S.classes.has(id)?S.classes.delete(id):S.classes.add(id));return;}
  const lv=c('[data-lv]');if(lv){const [k,id]=lv.dataset.lv.split(':');const o=LEVELS[k].find(x=>x.id===id);const r=lvR(o);
    act(()=>{const on=new Set(LEVELS[k].filter(x=>levelOn(k,x)));on.has(o)?on.delete(o):on.add(o);
      if(!on.size){delete S.r[k];return;} const rs=[...on].map(lvR);S.r[k]=[Math.min(...rs.map(x=>x[0])),Math.max(...rs.map(x=>x[1]))];});return;}
  const lg=c('[data-lang]');if(lg){const id=lg.dataset.lang;ui.langOpen=false;ui.langQ='';act(()=>{S.langs=S.langs.includes(id)?S.langs.filter(x=>x!==id):[...S.langs,id];});return;}
  const lm=c('[data-lmode]');if(lm){act(()=>S.langMode=lm.dataset.lmode);return;}
  if(c('[data-var]')){act(()=>S.variable=!S.variable);return;}
  const it=c('[data-it]');if(it){const v=it.dataset.it==='1';act(()=>S.italic=S.italic===v?null:v);return;}
  if(c('[data-favf]')){act(()=>S.fav=!S.fav);return;}
  const sr=c('[data-src]');if(sr){const v=sr.dataset.src;act(()=>S.sources.has(v)?S.sources.delete(v):S.sources.add(v));return;}
  const li=c('[data-lic]');if(li){const v=li.dataset.lic;act(()=>S.lic.has(v)?S.lic.delete(v):S.lic.add(v));return;}
  const vt=c('[data-vt]');if(vt){const k=vt.dataset.vt;act(()=>S.vt[k]=!S.vt[k]);return;}
  const ar=c('[data-axrst]');if(ar){act(()=>delete S.r[ar.dataset.axrst]);return;}
  const ac=c('[data-ac]');if(ac){act(()=>ui.items[+ac.dataset.ac].ap());q.value='';ui.ac=false;render();return;}
  const st=c('[data-fav]');if(st){const f=FONTS[+st.dataset.fav];f.fav=!f.fav;render();return;}
  if(c('#theme')){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';return;}
  if(!c('#searchwrap')&&!c('#adv')&&!c('.demo')&&!c('#toast')){if(ui.ac||ui.basic||ui.act){ui.ac=false;ui.basic=false;ui.act=false;render();}}
  if(!c('.combo')&&ui.langOpen){ui.langOpen=false;render();}
});
const refocusLang=p=>{const n=$('#langq');if(n){n.focus();n.setSelectionRange(p,p);}};
document.addEventListener('focusin',e=>{if(e.target.id==='langq'&&!ui.langOpen){ui.langOpen=true;const p=e.target.selectionStart;render();refocusLang(p);}});
document.addEventListener('input',e=>{if(e.target.id==='langq'){ui.langQ=e.target.value;ui.langOpen=true;const p=e.target.selectionStart;render();refocusLang(p);}});
addEventListener('resize',()=>renderSummary());

// ================= Demo =================
document.querySelector('.demo').addEventListener('click',e=>{
  const b=e.target.closest('[data-demo]');if(!b)return;const m=b.dataset.demo;
  if(m==='loc'){LOC=LOC==='vi'?'en':'vi';render();return;}
  S=fresh();undo=[];Object.assign(ui,{basic:false,adv:false,ac:false,act:false,selGroup:-1,langOpen:false,langQ:''});q.value='';
  if(m==='basic'){S.langs=['vie'];S.classes.add('serif');ui.basic=true;}
  if(m==='adv'){S.langs=['vie'];S.r.x_height_em=[.48,.54];S.r.weight=[400,700];ui.adv=true;}
  if(m==='many'||m==='list'){S.classes.add('sans');S.classes.add('mono');S.langs=['vie','eng','fra','deu','pol'];S.r.weight=[400,700];S.variable=true;S.r.x_height_em=[.46,.56];S.r.contrast=[.6,1];S.fav=false;S.lic.add('ofl');if(m==='list')ui.act=true;}
  if(m==='ac'){q.value='ser';}
  if(m==='none'){S.classes.add('script');S.langs=['vie'];S.italic=true;}
  render();if(m==='ac'){q.focus();q.value='ser';ui.ac=true;renderAc();}
});
const qs=new URLSearchParams(location.search);
if(qs.get('theme'))document.documentElement.dataset.theme=qs.get('theme');
if(qs.get('loc'))LOC=qs.get('loc')==='en'?'en':'vi';
render();
if(qs.get('demo'))document.querySelector(`[data-demo="${qs.get('demo')}"]`)?.click();
if(qs.get('bk')){for(let i=0;i<+qs.get('bk');i++)q.dispatchEvent(new KeyboardEvent('keydown',{key:'Backspace',bubbles:true}));}
if(qs.get('tip'))setTimeout(()=>{const k=qs.get('tip');const el=k==='lang'?document.querySelector('.lang[data-s="part"]'):k.startsWith('cls:')?document.querySelector(`[data-cls="${k.slice(4)}"]`):document.querySelector(`[data-axtip="${k}"]`);el?.dispatchEvent(new PointerEvent('pointerover',{bubbles:true}));},50);
</script>
</body>
