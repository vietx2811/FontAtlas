<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FontAtlas · Pairing Desk — prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;600;700&family=Alegreya:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Fraunces:ital,wght@0,400;0,600;0,800;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;600;700&family=Oswald:wght@300;400;500;600;700&family=Roboto+Slab:wght@300;400;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Abril+Fatface&family=Space+Mono:wght@400;700&display=swap">
<style>
/*
  Pairing Desk — prototype vòng 2. Tài liệu: docs/design/font-desk/05_layout_options_v2.md
  · Font Google là stand-in cho thư viện người dùng. Số đo trục và nhãn ●◐◆○ là DỮ LIỆU GIẢ (luật rút gọn mô phỏng R1–R9).
  · DM Serif Display, Abril Fatface không có bộ tiếng Việt trên Google Fonts → minh hoạ cảnh báo thiếu ký tự.
  · Icon: lucide (ISC), trích từ lucide-react 0.561 mà app đang dùng.
  · Tự lưu vào localStorage (mô phỏng user.db). Tham số URL để chụp ảnh: ?fresh=1&case=1&v=A|B|C&layout=…&cmp=2&dd=combo&theme=dark
*/
:root{
  --chrome:#F1EFEC; --hover:rgba(41,37,36,.06); --active:rgba(41,37,36,.10);
  --sheet:#FAFAFA; --card:#FFFFFF; --page:#FFFFFF; --ink:#1F1D1B; --fg:#2A2A2A; --muted:#78716C; --border:#E7E5E4; --border-2:#D6D3D1; --surface-2:#F3F2F0;
  --accent:#D4A574; --accent-ink:#9A6B3C; --accent-soft:#F5E6D3; --on:#3FA66B; --warn:#C2410C;
  --shadow:0 1px 2px rgba(41,37,36,.05),0 8px 24px rgba(41,37,36,.08);
  --pop-shadow:0 14px 36px rgba(41,37,36,.18),0 2px 6px rgba(41,37,36,.08);
  --font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side-w:232px; --r-sm:7px; --r-md:10px; --r-lg:14px;
  color-scheme:light;
}
[data-theme="dark"]{
  --chrome:#171513; --hover:rgba(250,250,249,.06); --active:rgba(250,250,249,.11);
  --sheet:#1C1917; --card:#23201E; --page:#F7F5F2; --fg:#F5F5F4; --muted:#A8A29E; --border:#2E2A27; --border-2:#3B3632; --surface-2:#2A2623;
  --accent:#E0B07E; --accent-ink:#E0B07E; --accent-soft:rgba(224,176,126,.15); --on:#4ADE80; --warn:#FB923C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); --pop-shadow:0 16px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}
@media (max-width:1279px){ :root{ --side-w:204px; } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chrome);color:var(--fg);font:13px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;min-width:1000px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:5px}
.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.i.s{width:14px;height:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100vh;padding:8px 8px 8px 0}
.side{display:flex;flex-direction:column;min-height:0;padding:0 8px}
.side-top{height:36px;display:flex;align-items:center;justify-content:flex-end;color:var(--muted)}
.side-scroll{flex:1;overflow:auto;scrollbar-width:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 9px;border-radius:var(--r-sm);text-align:left;font-size:13.5px;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav[aria-current="true"]{background:var(--active);font-weight:500}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .i{opacity:.75}
.nav.sub{color:var(--muted);font-size:12.5px}
.sec{margin-top:16px}
.sec-row{display:flex;align-items:center}
.sec-head{flex:1;display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;color:var(--muted);font-size:12.5px;font-weight:500;border-radius:var(--r-sm);text-align:left}
.sec-head:hover{color:var(--fg)}
.sec-add{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted);opacity:0}
.sec:hover .sec-add,.sec-add:focus-visible{opacity:1}
.sec-add:hover{background:var(--hover);color:var(--fg)}
.side-foot{display:flex;gap:2px;padding:6px 2px;color:var(--muted)}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);flex:none;position:relative}
.ib:hover{background:var(--hover);color:var(--fg)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.ib.sm{width:26px;height:26px}
.ib .badge{position:absolute;top:2px;right:1px;min-width:14px;height:14px;border-radius:7px;background:var(--accent-ink);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 3px}
.main{background:var(--sheet);border-radius:12px;box-shadow:var(--shadow);min-width:0;min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
[data-tip]{position:relative}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:90;pointer-events:none;background:#1F1D1B;color:#FAFAF9;font-size:11.5px;padding:5px 8px;border-radius:6px;white-space:nowrap;box-shadow:var(--pop-shadow);opacity:0;transition:opacity .08s}
#tip kbd{font:500 10.5px var(--font-ui);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 4px;margin-left:6px;color:#D6D3D1}

/* ---------- top bar ---------- */
.bar{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--border);min-width:0}
.grp{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid var(--border);height:28px;flex:none}
.grp:last-child{border-right:0}
.grp.name{min-width:0;flex:0 1 auto;padding-left:0}
.pname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;padding:3px 5px;border-radius:5px;outline:none}
.pname:hover{background:var(--hover)}
.pname:focus{background:var(--card);box-shadow:0 0 0 1px var(--border-2)}
.bar .sp{flex:1}
.saved{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;gap:4px;align-items:center}
.saved.busy{color:var(--accent-ink)}
.variant{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px}
.variant button{height:24px;min-width:26px;padding:0 7px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.variant button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;padding:6px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;font-size:11.5px}
.chip{height:24px;padding:0 6px 0 8px;border-radius:99px;background:var(--surface-2);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg)}
.chip .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip .x:hover{background:var(--active);color:var(--fg)}
@media (max-width:1279px){ .hide-n{display:none!important} .pname{max-width:150px} .grp{padding:0 4px} .stp .lb:has(.hide-n){min-width:0!important} }

/* ---------- Option Stepper ---------- */
.stp{display:inline-flex;align-items:center;height:28px;border:1px solid var(--border);border-radius:8px;background:var(--card);flex:none}
.stp button{height:26px;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.stp .nv{width:22px;justify-content:center;color:var(--muted)}
.stp .nv:hover:not([disabled]){color:var(--fg);background:var(--hover)}
.stp .nv:first-child{border-radius:7px 0 0 7px}
.stp .nv:last-child{border-radius:0 7px 7px 0}
.stp .nv[disabled]{opacity:.3;cursor:default}
.stp .lb{padding:0 6px;border-left:1px solid var(--border);border-right:1px solid var(--border);font-size:12.5px;white-space:nowrap;justify-content:space-between}
.stp .lb:hover{background:var(--hover)}
.stp .lb .t{overflow:hidden;text-overflow:ellipsis}
.stp .lb .dv{color:var(--muted)}
.stp[data-open="true"]{border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink)}
.stp .lb em{font-style:italic;color:var(--accent-ink)}
.stp .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}

/* ---------- popover ---------- */
#pop{position:fixed;z-index:70;display:none}
#pop.on{display:block}
.pop{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop-shadow);padding:5px;min-width:240px;max-height:min(70vh,560px);overflow:auto;font-size:12.5px}
.pop .cap{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:500;padding:8px 9px 4px}
.pop hr{border:0;border-top:1px solid var(--border);margin:4px 3px}
.opt{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;text-align:left;min-height:32px}
.opt:hover,.opt.kb{background:var(--surface-2)}
.opt .ck{width:14px;color:var(--accent-ink)}
.opt .tx{flex:1;min-width:0}
.opt .tx .d{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .kbd{font-size:10.5px;color:var(--muted)}
.opt .labs{display:flex;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.opt.sug{color:var(--fg)} .opt.sug .ck{color:var(--accent-ink)}
.filt{width:330px;padding:8px}
.f-row{display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-bottom:1px solid var(--border)}
.f-row:last-child{border-bottom:0}
.f-row .h{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--border);display:inline-flex;gap:5px;align-items:center;font-size:12px}
.seg button:hover{border-color:var(--border-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sw-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;width:100%;text-align:left}
.sw{width:26px;height:15px;border-radius:99px;background:var(--border-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;left:2px;top:2px;transition:left .15s}
[aria-checked="true"] > .sw{background:var(--accent-ink)}
[aria-checked="true"] > .sw::after{left:13px}
.adv summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.adv summary::-webkit-details-marker{display:none}
.adv[open] summary .i{transform:rotate(180deg)}

/* ---------- page + roles ---------- */
.canvas{flex:1;min-height:0;overflow:auto;position:relative;background:var(--sheet)}
.page{background:var(--page);color:var(--ink);border:1px solid var(--border);position:relative;margin:0 auto}
[data-theme="dark"] .page{border-color:transparent}
.role{position:relative;border-radius:3px;outline:1px solid transparent;outline-offset:4px;transition:outline-color .1s}
.page.live .role{cursor:pointer}
.page.live .role:hover{outline-color:rgba(154,107,60,.35)}
.page.live .role.sel{outline:1px dashed var(--accent-ink)}
.role.try{box-shadow:-7px 0 0 -5px var(--accent)}
.role[contenteditable="true"]{outline:1px solid var(--accent-ink)!important;cursor:text;background:#FFFCF8}
.miss{background:rgba(194,65,12,.15);box-shadow:inset 0 -2px 0 #C2410C}
.pg-editorial{width:640px;padding:50px 56px}
.pg-editorial .cols{columns:2;column-gap:26px;margin-top:22px}
.pg-editorial .cols p{margin:0 0 10px}
.pg-editorial blockquote{margin:16px 0;break-inside:avoid}
.pg-brand{width:720px;padding:42px 46px;display:grid;grid-template-columns:1.15fr 1fr;gap:24px 36px}
.pg-brand .full{grid-column:1/-1}
.aa{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--ink);padding-top:10px}
.aa .big{font-size:58px;line-height:1}
.aa .set{font-size:14px;letter-spacing:.04em;line-height:1.5;word-break:break-all}
.aa .cap{font:500 10px var(--font-ui);color:#77716B;letter-spacing:.06em;text-transform:uppercase}
.pg-poster{width:560px;min-height:700px;padding:48px 48px 40px;display:flex;flex-direction:column;gap:14px}
.pg-poster .rule{height:2px;background:var(--ink);margin:8px 0}
.pg-poster .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.pg-poster .cta{border:1.5px solid var(--ink);padding:8px 14px;border-radius:99px;white-space:nowrap}
.pg-ui{width:700px;padding:0 0 36px;overflow:hidden}
.pg-ui .nav-mock{height:44px;border-bottom:1px solid #ECEAE7;display:flex;align-items:center;gap:18px;padding:0 28px;font:12px var(--font-ui);color:#8a847e}
.pg-ui .nav-mock b{color:#1F1D1B;font-weight:600;margin-right:auto}
.pg-ui .hero{padding:44px 56px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pg-ui .btnmock{background:#1F1D1B;color:#fff;padding:10px 18px;border-radius:8px}
.pg-ui .stats{display:flex;gap:14px;align-items:baseline;padding:28px 56px 0;border-top:1px solid #ECEAE7;margin-top:34px}
.pg-pack{width:520px;padding:34px 38px}
.pg-pack .frame{border:1.5px solid var(--ink);border-radius:120px 120px 8px 8px;padding:64px 34px 26px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center;min-height:440px}
.pg-pack .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:18px;text-align:left;gap:16px;width:100%}

/* ---------- variant A: inline ---------- */
.a-wrap{display:grid;grid-template-columns:minmax(0,1fr) 56px;flex:1;min-height:0}
.a-wrap .canvas{padding:72px 36px 60px}
.ftb{position:absolute;z-index:20;display:flex;align-items:center;gap:2px;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:11px;box-shadow:var(--pop-shadow);padding:3px;white-space:nowrap;font:13px var(--font-ui)}
.ftb .sep{width:1px;height:20px;background:var(--border);margin:0 3px}
.ftb .fb{height:28px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;max-width:220px}
.ftb .fb:hover{background:var(--hover)}
.ftb .fb .t{overflow:hidden;text-overflow:ellipsis}
.ftb .fb[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-ink)}
.ftb .vb{width:20px;height:20px;border-radius:50%;background:var(--accent-ink);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:600;margin:0 4px}
.ftb .try{font-size:11.5px;color:var(--accent-ink);padding:0 6px;font-style:italic}
.ftb .ok{background:var(--fg);color:var(--card);height:28px;border-radius:7px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;font-weight:500}
[data-theme="dark"] .ftb .ok{background:var(--accent);color:#1C1917}
.rail{border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;position:relative;background:var(--sheet)}
.rail .vdot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;border:1px solid var(--border);background:var(--card);position:relative}
.rail .vdot.act{border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink)}
.rail .vdot .k{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;background:var(--fg);color:var(--card);font:600 9px/15px var(--font-ui);text-align:center}
.rail .vdot .wn{position:absolute;bottom:-4px;right:-4px;color:var(--warn);background:var(--card);border-radius:50%}
.rail-fly{position:absolute;right:62px;top:10px;width:250px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--pop-shadow);padding:6px;display:none;z-index:25}
.rail:hover .rail-fly,.rail:focus-within .rail-fly{display:block}
.vrow{display:flex;flex-direction:column;gap:3px;padding:8px 9px;border-radius:8px;text-align:left;width:100%}
.vrow:hover{background:var(--surface-2)}
.vrow .top{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.vrow .nm{font-size:17px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .rl{font-size:11px;color:var(--muted)}
.labs{display:inline-flex;gap:8px;font-size:11px;white-space:nowrap;color:var(--muted)}
.lab b{font-weight:400;margin-right:2px;color:var(--fg)}
.lab.k,.lab.k b{color:var(--warn)}
.lab.u{opacity:.75}
.vi-warn{display:flex;gap:6px;align-items:flex-start;color:var(--warn);font-size:11.5px}

/* font dropdown (A) / reel (C) */
.fdd{width:400px;padding:0}
.fdd-h{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--border)}
.fdd-h .q{flex:1;position:relative}
.fdd-h .q input{width:100%;height:28px;border:1px solid var(--border);border-radius:7px;background:var(--sheet);padding:0 8px 0 28px}
.fdd-h .q .i{position:absolute;left:8px;top:6px;color:var(--muted)}
.srcs{display:flex;gap:1px;padding:4px 6px;border-bottom:1px solid var(--border)}
.srcs button{height:28px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.srcs button:hover{color:var(--fg);background:var(--hover)}
.srcs button[aria-pressed="true"]{color:var(--fg);background:var(--surface-2);font-weight:500}
.srcs .lbx{display:inline}
.cl{max-height:360px;overflow:auto;padding:4px}
.crow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 8px;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer;position:relative}
.crow:hover,.crow.kb{background:var(--surface-2)}
.crow.cur{background:var(--accent-soft)}
.crow .sp1{font-size:19px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.crow .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden}
.crow .acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;opacity:0;background:var(--surface-2);border-radius:8px;padding:2px;align-items:center}
.crow.cur .acts{background:var(--accent-soft)}
.crow:hover .acts,.crow.kb .acts,.crow .acts:focus-within{opacity:1}
.crow .acts .on{opacity:1}
.crow .gate{font-size:10.5px;color:var(--muted);display:inline-flex;gap:3px;align-items:center}
.empty{padding:14px 12px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;gap:8px}
.empty .acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:28px;padding:0 10px;border-radius:7px;font-size:12px;border:1px solid var(--border);background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--border-2)}
.btn.pri{background:var(--fg);color:var(--card);border-color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- variant B: spread ---------- */
.b-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.b-head{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex:none}
.b-cols{flex:1;min-height:0;overflow:auto;display:grid;gap:14px;padding:14px;align-content:start}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.bcol-h{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.bcol-h .r1{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.bcol-h .r1 .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcol-h .r2{display:flex;align-items:center;gap:6px}
.bcol.cur .bcol-h{background:var(--accent-soft);border-color:var(--accent)}
.mini{overflow:hidden;border-radius:4px}
.mini .page{margin:0;transform-origin:0 0}
.b-metrics{border-top:1px solid var(--border);flex:none;background:var(--card)}
.b-metrics summary{padding:8px 14px;cursor:pointer;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);list-style:none}
.b-metrics summary::-webkit-details-marker{display:none}
.b-metrics .mt{display:grid;padding:0 14px 10px;gap:0 14px;font-size:12px}
.b-metrics .mt div{padding:4px 0;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- variant C: rail + reel ---------- */
.c-wrap{flex:1;min-height:0;display:grid;grid-template-columns:232px auto minmax(0,1fr)}
.c-rail{border-right:1px solid var(--border);overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.c-rail .h{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:500;padding:4px 8px 6px;display:flex;align-items:center;gap:6px}
.rrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 8px;padding:7px 8px;border-radius:9px;text-align:left;align-items:center}
.rrow:hover{background:var(--hover)}
.rrow[aria-selected="true"]{background:var(--card);box-shadow:0 0 0 1px var(--accent-ink)}
.rrow .vb{grid-row:1/4;width:20px;height:20px;border-radius:50%;border:1.2px solid var(--muted);color:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:600}
.rrow[aria-selected="true"] .vb{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.rrow .rn{font-size:11px;color:var(--muted)}
.rrow .fn{font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-reel{width:0;overflow:hidden;border-right:1px solid transparent;transition:width .16s ease;display:flex;flex-direction:column;background:var(--card)}
.c-reel.on{width:272px;border-right-color:var(--border)}
.c-reel .rh{padding:8px 8px 0;display:flex;flex-direction:column;gap:6px}
.c-reel .rh .t{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 2px}
.c-reel .cl{max-height:none;flex:1}
.c-wrap .canvas{padding:40px 30px}
.reel-hint{font-size:10.5px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--border);display:flex;gap:10px}

/* ---------- compare ---------- */
.cmp{flex:1;min-height:0;display:flex;flex-direction:column}
.cmp-h{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.cmp-h .ttl{font-weight:600;display:flex;align-items:center;gap:6px;margin-right:4px}
.cmp-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 20px}
.cmp-grid{display:grid;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;width:max-content;min-width:100%}
.cmp-grid > div{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 12px;min-width:0;position:relative}
.cmp-grid .rh{background:var(--sheet);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;position:sticky;left:0;z-index:2;white-space:nowrap}
.cmp-grid .rh.sortable{cursor:pointer}
.cmp-grid .rh.sortable:hover{color:var(--fg)}
.cmp-grid .rh.sorted{color:var(--accent-ink);font-weight:500}
.cmp-grid .ch{background:var(--sheet);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;z-index:3}
.cmp-grid .ch .r1{display:flex;align-items:center;gap:4px;font-weight:600;font-size:12.5px}
.cmp-grid .ch .r1 .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-grid .ch .hov{opacity:0;display:flex;gap:2px}
.cmp-grid .ch:hover .hov,.cmp-grid .ch:focus-within .hov{opacity:1}
.cmp-grid .ch.base{background:repeating-linear-gradient(135deg,var(--sheet),var(--sheet) 6px,var(--surface-2) 6px,var(--surface-2) 7px)}
.cmp-grid .ch.pinned .pinb{color:var(--accent-ink);opacity:1}
.cmp-grid .grip{cursor:grab;color:var(--muted);display:inline-grid;place-items:center;width:18px;height:22px;border-radius:4px}
.cmp-grid .grip:hover{background:var(--hover);color:var(--fg)}
.cmp-grid .cell-sp{font-size:20px;line-height:1.35;color:var(--fg);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cmp-grid .cell-sp.body{font-size:13px;line-height:1.5;-webkit-line-clamp:3}
.cmp-grid .cell-sp.vi{font-size:26px;letter-spacing:.06em;-webkit-line-clamp:1}
.cmp-grid .num{font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.cmp-grid .num .u{font-size:11px;color:var(--muted)}
.cmp-grid .num .sym{margin-left:auto;font-size:12px}
.cmp-grid .num .sym.k{color:var(--warn)}
.cmp-grid .dragover{box-shadow:inset 3px 0 0 var(--accent-ink)}
.cmp-grid .rdragover{box-shadow:inset 0 3px 0 var(--accent-ink)}
.cmp-grid .addc{display:grid;place-items:center;background:var(--sheet)}
.cmp-grid .gsep{background:var(--sheet);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:5px 12px}
.cmp-spread{display:grid;gap:14px}

/* ---------- home / lib ---------- */
.home{flex:1;overflow:auto;padding:40px 52px 56px}
.home-in{max-width:980px;margin:0 auto}
.home h1{font-size:21px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.home .lede{color:var(--muted);margin:0 0 24px;max-width:540px}
.start{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;display:grid;gap:12px}
.start h2{margin:0;font-size:14.5px;font-weight:600}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srow .k{width:70px;color:var(--muted);font-size:12px;display:flex;gap:5px;align-items:center}
.seed{flex:1;min-width:260px;position:relative}
.seed input{width:100%;height:36px;border:1px solid var(--border);border-radius:var(--r-md);padding:0 12px 0 34px;background:var(--sheet)}
.seed > .i{position:absolute;left:11px;top:10px;color:var(--muted)}
.seed-res{position:absolute;left:0;right:0;top:40px;z-index:5}
.pill{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--border);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--border-2)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.lh{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px}
.lh h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ccard{text-align:left;display:flex;flex-direction:column;gap:7px}
.thumb{aspect-ratio:16/10;background:var(--page);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;padding:14px 16px}
.ccard:hover .thumb{border-color:var(--border-2)}
.thumb .t3{font-size:7.5px;letter-spacing:.14em;color:#777;margin-bottom:7px;text-transform:uppercase}
.thumb .t1{font-size:19px;line-height:1.1}
.thumb .t2{font-size:9px;margin-top:8px;line-height:1.45;color:#444}
.ccard .nm{font-weight:500;display:flex;gap:6px;align-items:center}
.ccard .sub{font-size:11.5px;color:var(--muted)}
.lib-top{height:50px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
.lib-top h1{font-size:15px;margin:0;font-weight:600}
.lib-grid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-content:start}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 14px 10px;text-align:left;display:flex;flex-direction:column;gap:16px;min-height:124px}
.fcard[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fcard .spec{font-size:28px;line-height:1.3;white-space:nowrap;overflow:hidden}
.fcard .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1F1D1B;color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;box-shadow:var(--pop-shadow);z-index:95;display:flex;gap:12px;align-items:center}
.toast button{color:#E0B07E;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function axes(a, b){
  const out = [], ln = (x,y) => Math.abs(Math.log(x/y));
  const same = GROUP(a) === GROUP(b), sf = (a.sf && a.sf === b.sf) || a.id === b.id;

  const dw = ln(b.wd,a.wd); out.push({k:'wd', n:'độ rộng', g:'s', sym: dw < .10 ? '●' : dw > .25 ? '◐' : '◆'});
  if (a.lowConf || b.lowConf) out.push({k:'ap', n:'độ mở', g:'s', sym:'○'});
  out.push({k:'sf', n:'chân', g:'e', sym: same ? '●' : '◐'});
  const dc = ln(b.ct,a.ct); out.push({k:'ct', n:'tương phản nét', g:'e', sym: dc < .2 ? '●' : dc > .7 ? '◐' : (!same ? '◐' : '◆')});
  const exprC = out.some(x => x.g === 'e' && x.sym === '◐');
  const sAll = out.filter(x => x.g === 's').every(x => x.sym === '●' || x.sym === '○');
  if (!sf && same && !exprC && sAll) out.push({k:'gl', n:'gần như nhau', g:'x', sym:'◆'});
  else if (!sf && same && !exprC) out.push({k:'r8', n:'khung khác, da giống', g:'x', sym:'◆'});
  if (sf && a.id !== b.id) out.unshift({k:'fam', n:'cùng superfamily', g:'m', sym:'●'});
  return out;
}

  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 's') { e.preventDefault(); saveCombo(cs); return; }
  if (e.altKey && /^Digit[1-5]$/.test(e.code)) { e.preventDefault(); setLayout(cs, LKEYS[+e.code.slice(-1)-1]); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '[' || e.key === ']') { e.preventDefault(); stepStepper('combo', e.key === ']' ? 1 : -1); return; }
  if (e.key.toLowerCase() === 'm') { const i = MODES.findIndex(m => m[0] === cs.mode); cs.mode = MODES[(i+1) % 3][0]; touch(); render(); live('Chế độ ' + MODES[(i+1)%3][1]); return; }
  if (e.key.toLowerCase() === 'c') { $('[data-act="compare"]')?.click(); return; }
  if (e.key.toLowerCase() === 'f') { ui.dd = {id:'filter'}; render(); return; }
  if (cs.cmp?.open) return;
  const onPage = e.target.closest('.page.live') || e.target === document.body;
  if (S.variant === 'A' && onPage) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); $(`[data-act="a-step"][data-d="${e.key==='ArrowRight'?1:-1}"]`)?.click(); return; }
    if (e.key === 'Enter') { e.preventDefault(); if (ui.pv) setVoice(cs, ui.pv.slot, ui.pv.font, ui.pv.wAdj); else { ui.dd = {id:'font'}; render(); } return; }
  }
  if (S.variant === 'C' && onPage && e.key === 'ArrowRight' && !ui.reel) { ui.reel = true; render(); return; }
  if (S.variant === 'C' && e.key === 'ArrowLeft' && ui.reel) { ui.reel = false; endTry(); render(); return; }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && (onPage || e.target.closest('.c-rail'))) { e.preventDefault(); stepStepper('role', e.key === 'ArrowDown' ? 1 : -1); $(`.page.live [data-role="${cur().sel}"]`)?.focus({preventScroll:true}); return; }
  if (e.key.toLowerCase() === 'g' && ui.pv) { togglePin(cs, ui.pv.slot, ui.pv.font); return; }
});

/* ---------- tooltip ---------- */
document.addEventListener('pointerover', e => {
  const t = e.target.closest('[data-tip]'); const tip = $('#tip');
  if (!t) { tip.style.opacity = 0; return; }
  tip.innerHTML = esc(t.dataset.tip) + (t.dataset.kbd ? `<kbd>${esc(t.dataset.kbd)}</kbd>` : '');
  const r = t.getBoundingClientRect(); tip.style.opacity = 1;
  const w = tip.offsetWidth; tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width/2 - w/2)) + 'px';
  tip.style.top = (r.bottom + 6 + 24 > innerHeight ? r.top - 30 : r.bottom + 6) + 'px';
});
addEventListener('resize', () => { if (S.view === 'case') render(); });

/* ---------- tham số URL để chụp ảnh ---------- */
(() => { const q = new URLSearchParams(location.search);
  if (q.get('fresh') === '1') S = freshState();
  if (q.get('empty') === '1') { S = freshState(); S.cases = []; }
  if (q.get('theme')) S.theme = q.get('theme');
  if (q.get('v')) S.variant = q.get('v');
  if (q.get('case')) { S.open = +q.get('case'); S.view = 'case'; const cs = cur(); if (cs) { if (q.get('layout')) cs.layout = q.get('layout'); if (q.get('sel')) cs.sel = q.get('sel'); if (q.get('cmp')) openCompare(cs, +q.get('cmp')); if (q.get('spread')) cs.cmp.spread = true; } }
  if (q.get('view') === 'lib') S.view = 'lib';
  render();
  if (q.get('dd') && cur()) { ui.dd = {id:q.get('dd')}; render(); }
  if (q.get('try') && cur()) { setTimeout(() => tryCand(cur(), +q.get('try')), 50); }
  if (q.get('reel')) { ui.reel = true; render(); }
  if (q.get('seed')) createCase(q.get('seed'));
  if (q.get('bmet')) { ui.bMetrics = true; render(); }
})();
</script>
